<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AEROBAY - Work Updates Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
    }
    #root { max-width: 620px; margin: 0 auto; padding: 24px 16px 80px; }
    
    .brand-header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #1e293b;
    }
    .brand-logo {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 3px;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }
    .brand-subtitle { font-size: 13px; color: #94a3b8; margin-top: 4px; }

    .panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab {
      flex: 1; text-align: center; padding: 9px; border-radius: 8px;
      font-size: 13px; font-weight: 600; border: 1px solid #334155; background: #0f172a;
      cursor: pointer; color: #94a3b8;
    }
    .tab.active { background: #0284c7; color: white; border-color: #0284c7; }

    .field-label { font-size: 11.5px; color: #94a3b8; margin: 10px 0 4px; font-weight: 600; text-transform: uppercase; }
    input, select, textarea {
      width: 100%; border: 1px solid #334155; border-radius: 8px; padding: 10px 12px;
      font-size: 14px; outline: none; background: #0f172a; color: #f8fafc;
    }
    input:focus, select:focus, textarea:focus { border-color: #38bdf8; }

    .btn-primary {
      width: 100%; background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white; border: none; border-radius: 8px;
      padding: 11px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 14px;
    }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-admin { background: linear-gradient(135deg, #6366f1, #4f46e5); }

    .session-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #1e293b; border-radius: 12px; padding: 12px 16px;
      margin-bottom: 20px; border: 1px solid #334155;
    }
    .admin-tag {
      background: #4f46e5; color: white; font-size: 10px; font-weight: 700;
      padding: 2px 6px; border-radius: 4px; margin-left: 6px;
    }
    .logout-btn {
      background: transparent; border: 1px solid #475569; border-radius: 7px;
      padding: 6px 12px; font-size: 12px; cursor: pointer; color: #94a3b8;
    }

    .entry {
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      padding: 16px; margin-bottom: 12px;
    }
    .entry-meta {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 8px;
    }
    .entry-author { font-size: 14px; font-weight: 700; color: #38bdf8; }
    .entry-team {
      font-size: 11px; font-weight: 700; color: #94a3b8; background: #0f172a;
      border-radius: 5px; padding: 2px 8px; margin-left: 8px; border: 1px solid #334155;
    }
    .entry-date-badge { font-size: 11px; color: #f59e0b; font-weight: 600; }
    .entry-text { font-size: 14.5px; line-height: 1.6; color: #e2e8f0; white-space: pre-wrap; }

    /* Admin Accounts Table */
    .user-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12.5px; }
    .user-table th, .user-table td { padding: 8px; border-bottom: 1px solid #334155; text-align: left; }
    .user-table th { color: #94a3b8; }
    .user-pass { color: #f43f5e; font-family: monospace; font-size: 13px; }
    .del-btn { color: #ef4444; background: none; border: none; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- CDN scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script type="text/babel">
    // -------------------------------------------------------------
    // REPLACE THESE TWO STRINGS WITH YOUR COPIED KEYS FROM SUPABASE:
    const SUPABASE_URL = "https://xccsvpkdojtopyqthggy.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_-qarPe7On3pQgb-mheQquA_k-QJmrcz";
    // -------------------------------------------------------------
    
    const ADMIN_SECRET = "f6@9pXM1"; // Your secret admin key
    const supabase = (SUPABASE_URL !== "YOUR_SUPABASE_URL_HERE") ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    const { useState, useEffect, useCallback } = React;

    function App() {
      const [entries, setEntries] = useState([]);
      const [userList, setUserList] = useState([]);
      const [session, setSession] = useState(null);
      const [loading, setLoading] = useState(true);

      const [authMode, setAuthMode] = useState('login');
      const [loginId, setLoginId] = useState('');
      const [loginPw, setLoginPw] = useState('');
      const [suId, setSuId] = useState('');
      const [suPw, setSuPw] = useState('');
      const [suName, setSuName] = useState('');
      const [suTeam, setSuTeam] = useState('Production mechanical');
      const [adminKeyInput, setAdminKeyInput] = useState('');
      const [authError, setAuthError] = useState(null);

      const todayISO = new Date().toISOString().slice(0, 10);
      const [selectedDate, setSelectedDate] = useState(todayISO);
      const [postText, setPostText] = useState('');

      const [teamFilter, setTeamFilter] = useState('ALL');
      const [downloadMonth, setDownloadMonth] = useState(todayISO.slice(0, 7));

      const standardTeams = [
        "Production Mechanical",
        " Production Electronics",
        " Packing",
        " Aero modelling",
        " Lab coordinator",
        " Others"
      ];

      // Universal Data Sync
      const fetchData = useCallback(async () => {
        if (!supabase) {
          setLoading(false);
          return;
        }
        setLoading(true);
        try {
          const { data: eData } = await supabase.from('entries').select('*').order('work_date', { ascending: false });
          const { data: uData } = await supabase.from('users').select('*');
          if (eData) setEntries(eData);
          if (uData) setUserList(uData);
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      }, []);

      useEffect(() => { fetchData(); }, [fetchData]);

      const handleSignup = async () => {
        setAuthError(null);
        if (!supabase) return setAuthError("Please add your Supabase keys to line 147 first.");
        const id = suId.trim().toLowerCase();
        if (!id || !suPw || !suName.trim()) return setAuthError('Fill out all fields.');

        const { data: exists } = await supabase.from('users').select('id').eq('id', id).single();
        if (exists) return setAuthError('That ID already exists.');

        const { error } = await supabase.from('users').insert([
          { id, plain_password: suPw, name: suName.trim(), team: suTeam }
        ]);

        if (error) {
          setAuthError('Sign up failed: ' + error.message);
        } else {
          setSession({ id, name: suName.trim(), team: suTeam, isAdmin: false });
          fetchData();
        }
      };

      const handleLogin = async () => {
        setAuthError(null);
        if (!supabase) return setAuthError("Please add your Supabase keys to line 147 first.");
        const id = loginId.trim().toLowerCase();

        const { data: user } = await supabase.from('users').select('*').eq('id', id).single();
        if (!user || user.plain_password !== loginPw) {
          return setAuthError('Wrong user ID or password.');
        }

        setSession({ id: user.id, name: user.name, team: user.team, isAdmin: false });
      };

      const handleAdminLogin = () => {
        if (adminKeyInput === ADMIN_SECRET) {
          setSession({ id: 'admin', name: 'AEROBAY Admin', team: 'Management', isAdmin: true });
        } else {
          setAuthError('Invalid Admin Key.');
        }
      };

      const handlePost = async () => {
        if (!postText.trim() || !session) return;
        const newEntry = {
          id: 'post_' + Date.now(),
          text: postText.trim(),
          author: session.name,
          team: session.team,
          owner_id: session.id,
          work_date: selectedDate,
          ts: Date.now()
        };

        const { error } = await supabase.from('entries').insert([newEntry]);
        if (!error) {
          setPostText('');
          fetchData();
        }
      };

      const handleDeletePost = async (id) => {
        await supabase.from('entries').delete().eq('id', id);
        fetchData();
      };

      // Admin Superpower: Delete Account
      const handleDeleteUser = async (userId) => {
        if (confirm(`Are you sure you want to delete user ${userId}?`)) {
          await supabase.from('users').delete().eq('id', userId);
          fetchData();
        }
      };

      // Excel Generator
      const downloadTeamExcel = () => {
        const filtered = entries.filter(e => {
          const matchTeam = teamFilter === 'ALL' || e.team === teamFilter;
          const matchMonth = e.work_date && e.work_date.startsWith(downloadMonth);
          return matchTeam && matchMonth;
        });

        if (filtered.length === 0) return alert('No updates found for this team/month.');

        const dataRows = filtered.map(e => ({
          "Work Date": e.work_date,
          "Team": e.team,
          "Member Name": e.author,
          "Update": e.text
        }));

        const ws = XLSX.utils.json_to_sheet(dataRows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Updates");
        XLSX.writeFile(wb, `AEROBAY_${teamFilter}_${downloadMonth}.xlsx`);
      };

      return (
        <div>
          <div className="brand-header">
            <div className="brand-logo">AEROBAY</div>
            <div className="brand-subtitle">Work Updates Portal</div>
          </div>

          {!session ? (
            <div className="panel">
              <div className="tabs">
                <div className={"tab " + (authMode === 'login' ? 'active' : '')} onClick={() => setAuthMode('login')}>User Login</div>
                <div className={"tab " + (authMode === 'signup' ? 'active' : '')} onClick={() => setAuthMode('signup')}>Register</div>
                <div className={"tab " + (authMode === 'admin' ? 'active' : '')} onClick={() => setAuthMode('admin')}>Admin Portal</div>
              </div>

              {authMode === 'login' && (
                <div>
                  <div className="field-label">User ID</div>
                  <input value={loginId} onChange={e => setLoginId(e.target.value)} placeholder="e.g. rohit" />
                  <div className="field-label">Password</div>
                  <input type="password" value={loginPw} onChange={e => setLoginPw(e.target.value)} placeholder="••••••••" />
                  <button className="btn-primary" onClick={handleLogin}>Log In</button>
                </div>
              )}

              {authMode === 'signup' && (
                <div>
                  <div className="field-label">Choose ID</div>
                  <input value={suId} onChange={e => setSuId(e.target.value)} placeholder="e.g. rohit" />
                  <div className="field-label">Password</div>
                  <input type="password" value={suPw} onChange={e => setSuPw(e.target.value)} placeholder="••••••••" />
                  <div className="field-label">Full Name</div>
                  <input value={suName} onChange={e => setSuName(e.target.value)} placeholder="e.g. Rohit Kumar" />
                  <div className="field-label">Team</div>
                  <select value={suTeam} onChange={e => setSuTeam(e.target.value)}>
                    {standardTeams.map(t => <option key={t} value={t}>{t}</option>)}
                  </select>
                  <button className="btn-primary" onClick={handleSignup}>Create Account</button>
                </div>
              )}

              {authMode === 'admin' && (
                <div>
                  <div className="field-label">Admin Secret Key</div>
                  <input type="password" value={adminKeyInput} onChange={e => setAdminKeyInput(e.target.value)} placeholder="Enter admin key" />
                  <button className="btn-primary btn-admin" onClick={handleAdminLogin}>Access Admin Controls</button>
                </div>
              )}

              {authError && <div style={{color: '#ef4444', fontSize: 13, marginTop: 10}}>{authError}</div>}
            </div>
          ) : (
            <div>
              <div className="session-bar">
                <div>
                  Active: <b>{session.name}</b>
                  {session.isAdmin && <span className="admin-tag">Admin</span>}
                  <div style={{fontSize: 11, color: '#94a3b8'}}>{session.team}</div>
                </div>
                <button className="logout-btn" onClick={() => setSession(null)}>Log Out</button>
              </div>

              {/* Admin Special Powers Panel */}
              {session.isAdmin && (
                <div className="panel" style={{border: '1px solid #6366f1'}}>
                  <div style={{color: '#818cf8', fontWeight: 700, fontSize: 14, marginBottom: 8}}>
                    👑 Admin Power: Registered Accounts & Passwords
                  </div>
                  <table className="user-table">
                    <thead>
                      <tr>
                        <th>User ID</th>
                        <th>Name</th>
                        <th>Team</th>
                        <th>Password</th>
                        <th>Action</th>
                      </tr>
                    </thead>
                    <tbody>
                      {userList.map(u => (
                        <tr key={u.id}>
                          <td>{u.id}</td>
                          <td>{u.name}</td>
                          <td>{u.team}</td>
                          <td className="user-pass">{u.plain_password}</td>
                          <td>
                            <button className="del-btn" onClick={() => handleDeleteUser(u.id)}>Delete</button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}

              {/* Work Update Input */}
              <div className="panel">
                <div className="field-label" style={{marginTop: 0}}>Select Date of Work</div>
                <input type="date" value={selectedDate} onChange={e => setSelectedDate(e.target.value)} style={{marginBottom: 12}} />
                <div className="field-label">Work Update Details</div>
                <textarea rows="3" placeholder="Describe your tasks..." value={postText} onChange={e => setPostText(e.target.value)} />
                <button className="btn-primary" onClick={handlePost} disabled={!postText.trim()}>Post Update</button>
              </div>
            </div>
          )}

          {/* Excel Export */}
          <div className="panel">
            <div style={{fontSize: 14, fontWeight: 700, color: '#38bdf8', marginBottom: 12}}>
              Team-Wise Excel Download
            </div>
            <select value={teamFilter} onChange={e => setTeamFilter(e.target.value)} style={{marginBottom: 10}}>
              <option value="ALL">All Teams</option>
              {standardTeams.map(t => <option key={t} value={t}>{t}</option>)}
            </select>
            <input type="month" value={downloadMonth} onChange={e => setDownloadMonth(e.target.value)} style={{marginBottom: 12}} />
            <button className="btn-primary" onClick={downloadTeamExcel}>Download Excel Report</button>
          </div>

          {/* Universal Submissions Feed */}
          <div style={{fontSize: 13, fontWeight: 700, color: '#94a3b8', textTransform: 'uppercase', marginBottom: 12}}>
            Live Universal Submissions
          </div>

          {loading ? (
            <div style={{textAlign: 'center', color: '#64748b', padding: 20}}>Loading shared data...</div>
          ) : entries.length === 0 ? (
            <div style={{textAlign: 'center', color: '#64748b', padding: 20}}>No updates found.</div>
          ) : (
            entries.map(e => (
              <div className="entry" key={e.id}>
                <div className="entry-meta">
                  <div>
                    <span className="entry-author">{e.author}</span>
                    <span className="entry-team">{e.team}</span>
                  </div>
                  <span className="entry-date-badge">📅 {e.work_date}</span>
                </div>
                <div className="entry-text">{e.text}</div>
                {(session && (session.isAdmin || session.id === e.owner_id)) && (
                  <div style={{marginTop: 8}}>
                    <button className="del-btn" onClick={() => handleDeletePost(e.id)}>Delete Log</button>
                  </div>
                )}
              </div>
            ))
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
