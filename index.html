<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aerobay - Work Update Portal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap');

    /* --- DYNAMIC GLASSMORPHISM THEME --- */
    :root {
      --text-main: #0f172a;
      --text-muted: #475569;
      --glass-bg: rgba(255, 255, 255, 0.5);
      --glass-border: rgba(255, 255, 255, 0.8);
      --glass-highlight: rgba(255, 255, 255, 0.4);
      --input-bg: rgba(255, 255, 255, 0.6);
      --input-border: rgba(56, 189, 248, 0.4);
      --card-bg: rgba(255, 255, 255, 0.7);
      --card-hover: rgba(255, 255, 255, 0.9);
      --shadow: rgba(0, 0, 0, 0.1);
      --btn-grad-1: #0ea5e9; --btn-grad-2: #2563eb;
    }

    [data-theme="dark"] {
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --glass-bg: rgba(15, 23, 42, 0.45);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-highlight: rgba(255, 255, 255, 0.05);
      --input-bg: rgba(0, 0, 0, 0.3);
      --input-border: rgba(56, 189, 248, 0.4);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-hover: rgba(255, 255, 255, 0.1);
      --shadow: rgba(0, 0, 0, 0.5);
      --btn-grad-1: #0284c7; --btn-grad-2: #1e40af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; cursor: crosshair; }

    body {
      background-color: #000;
      color: var(--text-main);
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      overflow-x: hidden; transition: color 0.5s ease;
    }

    /* THE CANVAS DYNAMIC SKY */
    #canvas-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; }

    #root { width: 100%; max-width: 700px; padding: 40px 20px 100px; position: relative; z-index: 1; }

    /* TIME SLIDER CONTROLS */
    .time-controller {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      padding: 12px 24px; border-radius: 30px; box-shadow: 0 10px 30px var(--shadow);
      display: flex; align-items: center; gap: 15px; z-index: 100;
      transition: all 0.3s ease; width: 90%; max-width: 400px;
    }
    .time-label { font-size: 18px; font-weight: bold; color: var(--text-main); }
    .time-slider {
      flex: 1; -webkit-appearance: none; appearance: none;
      height: 8px; border-radius: 4px; background: var(--input-bg);
      outline: none; transition: 0.3s;
    }
    .time-slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 22px; height: 22px; border-radius: 50%;
      background: #f59e0b; cursor: pointer; box-shadow: 0 0 10px rgba(245, 158, 11, 0.8);
      border: 2px solid white; transition: 0.2s;
    }
    .time-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }

    /* HEADER */
    .brand-header { text-align: center; margin-bottom: 30px; display: flex; flex-direction: column; align-items: center; }
    .brand-title {
      font-size: 42px; font-weight: 900; letter-spacing: 6px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-transform: uppercase; margin-top: 10px;
      filter: drop-shadow(0 4px 15px rgba(56, 189, 248, 0.4));
    }
    .brand-subtitle { font-size: 14px; color: var(--text-muted); margin-top: 4px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }

    /* GLASS PANELS */
    .panel {
      background: var(--glass-bg);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border); border-top: 1px solid var(--glass-highlight);
      border-radius: 20px; padding: 28px; margin-bottom: 24px;
      box-shadow: 0 15px 35px var(--shadow); transition: all 0.3s ease;
    }

    /* TABS */
    .tabs { display: flex; gap: 12px; margin-bottom: 24px; }
    .tab {
      flex: 1; text-align: center; padding: 12px; border-radius: 12px;
      font-size: 14px; font-weight: 600; background: var(--input-bg); border: 1px solid var(--glass-border);
      color: var(--text-muted); transition: all 0.3s ease; backdrop-filter: blur(10px);
    }
    .tab.active { background: var(--btn-grad-1); color: white; border-color: var(--btn-grad-1); box-shadow: 0 0 20px rgba(14, 165, 233, 0.4); }

    /* NAV BAR */
    .nav-bar { display: flex; gap: 10px; margin-bottom: 24px; overflow-x: auto; padding-bottom: 5px; }
    .nav-item {
      padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 700;
      background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-muted);
      white-space: nowrap; transition: 0.2s; backdrop-filter: blur(10px);
    }
    .nav-item.active { background: var(--btn-grad-1); color: white; border-color: var(--btn-grad-1); box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4); }

    /* FORMS */
    .field-label { font-size: 12px; color: var(--text-main); opacity: 0.8; margin: 16px 0 8px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
    input, select, textarea {
      width: 100%; border: 1px solid var(--glass-border); border-radius: 12px; padding: 14px;
      font-size: 15px; outline: none; background: var(--input-bg); color: var(--text-main); transition: 0.3s;
      backdrop-filter: blur(10px);
    }
    input:focus, select:focus, textarea:focus { border-color: #38bdf8; box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.2); }

    /* BUTTONS */
    .btn-primary {
      width: 100%; background: linear-gradient(135deg, var(--btn-grad-1), var(--btn-grad-2));
      color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 12px;
      padding: 14px; font-size: 15px; font-weight: 800; margin-top: 24px; backdrop-filter: blur(10px);
      transition: 0.3s; box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4); text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: center; align-items: center; gap: 8px;
    }
    .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(37, 99, 235, 0.7); }
    .btn-primary:disabled { opacity: 0.5; box-shadow: none; transform: none; }

    .btn-mic {
      background: var(--input-bg); border: 1px solid #0ea5e9; color: #0ea5e9; border-radius: 8px;
      padding: 10px 14px; transition: 0.2s; display: flex; align-items: center; gap: 6px; font-weight: bold; margin-bottom: 10px; backdrop-filter: blur(5px);
    }
    .btn-mic.listening { background: #ef4444; color: white; border-color: #ef4444; animation: pulse 1.5s infinite; }
    .btn-mic:disabled { opacity: 0.5; }

    /* SESSION & STREAK */
    .session-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--glass-bg); border-radius: 16px; padding: 18px 24px;
      margin-bottom: 24px; border: 1px solid var(--glass-border); box-shadow: 0 10px 30px var(--shadow);
      backdrop-filter: blur(24px);
    }
    .streak-badge { background: linear-gradient(135deg, #f59e0b, #ea580c); color: white; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px; box-shadow: 0 4px 10px rgba(245, 158, 11, 0.4); }
    .admin-tag { background: #4f46e5; color: white; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 6px; margin-left: 8px; text-transform: uppercase; }
    .logout-btn { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 10px; padding: 8px 16px; font-size: 13px; font-weight: 700; color: #ef4444; transition: 0.2s; backdrop-filter: blur(5px); }
    .logout-btn:hover { background: #ef4444; color: white; }

    /* FEED ENTRIES WITH ANIMATION */
    .entry {
      background: var(--card-bg); border: 1px solid var(--glass-border); border-left: 5px solid #0ea5e9;
      border-radius: 16px; padding: 20px; margin-bottom: 16px; transition: 0.2s; box-shadow: 0 8px 25px var(--shadow);
      animation: slideUp 0.4s ease forwards; opacity: 0; transform: translateY(20px); backdrop-filter: blur(10px);
    }
    .entry:hover { transform: translateX(4px) translateY(0) !important; background: var(--card-hover); }
    .entry-meta { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
    .entry-author { font-size: 16px; font-weight: 800; color: var(--text-main); }
    .entry-team { font-size: 11px; font-weight: 800; color: #0284c7; background: rgba(2, 132, 199, 0.15); border-radius: 6px; padding: 4px 10px; margin-left: 12px; text-transform: uppercase; border: 1px solid rgba(2, 132, 199, 0.4); }
    .entry-date-badge { font-size: 12px; color: var(--text-main); font-weight: 700; background: var(--input-bg); padding: 4px 10px; border-radius: 6px; border: 1px solid var(--glass-border); }
    .entry-text { font-size: 15px; line-height: 1.7; color: var(--text-main); opacity: 0.9; white-space: pre-wrap; }
    .del-btn { color: #ef4444; background: none; border: none; font-weight: 800; font-size: 12px; text-transform: uppercase; }

    /* TOASTS */
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
    .toast { background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(15px); color: var(--text-main); padding: 16px 24px; border-radius: 12px; box-shadow: 0 10px 40px var(--shadow); font-weight: 600; font-size: 14px; animation: slideInRight 0.3s ease forwards; display: flex; align-items: center; gap: 12px; }
    .toast.error { border-left: 5px solid #ef4444; }
    .toast.success { border-left: 5px solid #10b981; }

    /* TABLES */
    .user-table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 13px; }
    .user-table th, .user-table td { padding: 12px; border-bottom: 1px solid var(--glass-border); text-align: left; }
    .user-table th { color: #0ea5e9; font-weight: 800; text-transform: uppercase; font-size: 11px; }
    .user-pass { color: #f43f5e; font-family: monospace; font-size: 14px; background: rgba(225, 29, 72, 0.15); padding: 4px 8px; border-radius: 6px; font-weight: bold; border: 1px solid rgba(225, 29, 72, 0.4); }

    /* ANIMATIONS */
    @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

    /* LOGO ANIMATIONS */
    .logo-svg { filter: drop-shadow(0px 0px 15px rgba(56, 189, 248, 0.6)); overflow: visible; }
    .logo-ring { transform-origin: 50px 50px; animation: spinRing 40s linear infinite; }
    .logo-rocket { animation: floatRocket 6s ease-in-out infinite; }
    .logo-exhaust line { animation: exhaustPulse 0.5s alternate infinite ease-in; }
    .logo-exhaust line:nth-child(1) { animation-delay: 0.0s; }
    .logo-exhaust line:nth-child(2) { animation-delay: 0.2s; }
    .logo-exhaust line:nth-child(3) { animation-delay: 0.4s; }
    @keyframes spinRing { 100% { transform: rotate(360deg); } }
    @keyframes floatRocket { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
    @keyframes exhaustPulse { 0% { opacity: 0.2; transform: translateY(-2px); } 100% { opacity: 1; transform: translateY(2px); } }

    /* --- RBAC ADDITIONS --- */
    .skeleton { height: 90px; border-radius: 16px; background: var(--card-bg); border: 1px solid var(--glass-border); margin-bottom: 16px; animation: pulseSk 1.2s ease-in-out infinite; }
    @keyframes pulseSk { 0%,100% { opacity: .4; } 50% { opacity: .9; } }
    .btn-google { width: 100%; margin-top: 12px; background: var(--input-bg); color: var(--text-main); border: 1px solid var(--glass-border); border-radius: 12px; padding: 13px; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 10px; backdrop-filter: blur(10px); transition: .2s; }
    .btn-google:hover { background: var(--card-hover); transform: translateY(-1px); }
    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0 4px; color: var(--text-muted); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--glass-border); }
    .badge-missing { background: linear-gradient(135deg, #ef4444, #b91c1c); color: #fff; font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px; box-shadow: 0 4px 10px rgba(239,68,68,.4); }
    .badge-level { font-size: 11px; font-weight: 800; color: #8b5cf6; background: rgba(139,92,246,.15); border: 1px solid rgba(139,92,246,.4); border-radius: 6px; padding: 3px 8px; margin-left: 8px; text-transform: uppercase; }
    .badge-ok { background: rgba(16,185,129,.15); border: 1px solid rgba(16,185,129,.4); color: #10b981; font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.4); color: #ef4444; border-radius: 20px; padding: 6px 12px; font-size: 12px; font-weight: 800; margin: 4px 6px 4px 0; }
    .btn-small { background: var(--input-bg); border: 1px solid #0ea5e9; color: #0ea5e9; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 800; transition: .2s; white-space: nowrap; }
    .btn-small:hover { background: #0ea5e9; color: #fff; }
    .btn-small.danger { border-color: #ef4444; color: #ef4444; }
    .btn-small.danger:hover { background: #ef4444; color: #fff; }
    .link { color: #38bdf8; font-size: 13px; font-weight: 700; text-align: right; margin-top: 10px; }
    .link:hover { text-decoration: underline; }
    .dept-heading { font-size: 12px; font-weight: 800; color: #0284c7; text-transform: uppercase; letter-spacing: 1px; margin: 20px 0 10px; display: flex; align-items: center; gap: 8px; }
    .dept-heading::after { content: ''; flex: 1; height: 1px; background: var(--glass-border); }
    .check-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); font-weight: 700; margin-top: 12px; }
    .check-row input { width: auto; }
  </style>
</head>
<body data-theme="dark">

  <canvas id="canvas-bg"></canvas>

  <div id="root"></div>

  <div class="time-controller">
    <div class="time-label" id="time-icon">🌙</div>
    <input type="range" min="0" max="24" value="2" step="0.1" class="time-slider" id="timeSlider">
    <div class="time-label" id="time-text">02:00</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    /* =========================================
       SOUND SYSTEM
       ========================================= */
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    window.addEventListener('mousedown', () => {
      initAudio();
      if(!audioCtx) return;
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.05);
    });

    window.playLoginSound = function() {
      if(!audioCtx) return;
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'triangle'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.5);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.5);
    };

    window.playUploadSound = function() {
      if(!audioCtx) return;
      [392.00, 523.25, 659.25, 783.99].forEach((freq, i) => {
        setTimeout(() => {
          const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
          osc.type = 'sine'; osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }, i * 60);
      });
    };

    /* =========================================
       CANVAS: DYNAMIC SKY, SUN, MOON, CLOUDS & SILHOUETTE
       ========================================= */
    const canvas = document.getElementById('canvas-bg');
    const ctx = canvas.getContext('2d');
    let width, height;

    const now = new Date();
    window.skyTime = now.getHours() + (now.getMinutes() / 60);

    const slider = document.getElementById('timeSlider');
    const timeIcon = document.getElementById('time-icon');
    const timeText = document.getElementById('time-text');
    slider.value = window.skyTime;

    const updateTimeUI = (t) => {
      let hours = Math.floor(t);
      let mins = Math.floor((t - hours) * 60);
      timeText.innerText = `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
      if (t >= 6 && t <= 18) { timeIcon.innerText = "☀️"; document.body.setAttribute('data-theme', 'light'); }
      else { timeIcon.innerText = "🌙"; document.body.setAttribute('data-theme', 'dark'); }
    };
    updateTimeUI(window.skyTime);

    slider.addEventListener('input', (e) => {
      window.skyTime = parseFloat(e.target.value);
      updateTimeUI(window.skyTime);
    });

    const resize = () => {
      width = window.innerWidth; height = window.innerHeight;
      canvas.width = width; canvas.height = height;
    };
    window.addEventListener('resize', resize); resize();

    const stars = Array(200).fill().map(() => ({
      x: Math.random()*2000, y: Math.random()*2000,
      size: Math.random()*1.5, twinkleSpeed: Math.random() * 0.05 + 0.01, opacity: Math.random()
    }));

    const clouds = Array(8).fill().map(() => ({
      x: Math.random() * width, y: height * 0.1 + Math.random() * (height * 0.3),
      size: 40 + Math.random() * 60, speed: 0.1 + Math.random() * 0.3
    }));

    function drawCloud(x, y, size, opacity, color) {
      ctx.fillStyle = color;
      ctx.globalAlpha = opacity;
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.arc(x + size*0.8, y - size*0.3, size*0.8, 0, Math.PI * 2);
      ctx.arc(x + size*1.5, y, size*0.9, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1.0;
    }

    function drawSilhouette() {
      ctx.fillStyle = '#020617';
      ctx.beginPath();
      ctx.moveTo(0, height);
      ctx.lineTo(0, height - 80);
      ctx.quadraticCurveTo(width * 0.2, height - 150, width * 0.5, height - 90);
      ctx.quadraticCurveTo(width * 0.8, height - 40, width, height - 120);
      ctx.lineTo(width, height);
      ctx.fill();
      const personX = width * 0.35;
      const personY = height - 110;
      ctx.beginPath();
      ctx.arc(personX, personY - 15, 4, 0, Math.PI*2);
      ctx.fill();
      ctx.fillRect(personX - 2, personY - 10, 4, 15);
      ctx.fillRect(personX - 5, personY - 10, 10, 3);
    }

    const animateSky = () => {
      const t = window.skyTime;
      const isDay = t > 6 && t < 18;
      const angle = ((t - 6) / 12) * Math.PI;
      const centerX = width / 2;
      const arcRadius = height * 0.7;
      const sunX = centerX - Math.cos(angle) * arcRadius;
      const sunY = height - Math.sin(angle) * arcRadius;
      const moonAngle = angle + Math.PI;
      const moonX = centerX - Math.cos(moonAngle) * arcRadius;
      const moonY = height - Math.sin(moonAngle) * arcRadius;

      let skyGrad = ctx.createLinearGradient(0, 0, 0, height);
      if (t < 5 || t > 19) { skyGrad.addColorStop(0, '#020617'); skyGrad.addColorStop(1, '#0f172a'); }
      else if (t >= 5 && t <= 7) { skyGrad.addColorStop(0, '#312e81'); skyGrad.addColorStop(0.5, '#f43f5e'); skyGrad.addColorStop(1, '#fcd34d'); }
      else if (t > 7 && t < 17) { skyGrad.addColorStop(0, '#0ea5e9'); skyGrad.addColorStop(1, '#e0f2fe'); }
      else if (t >= 17 && t <= 19) { skyGrad.addColorStop(0, '#1e1b4b'); skyGrad.addColorStop(0.5, '#c026d3'); skyGrad.addColorStop(1, '#f59e0b'); }
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, width, height);

      let starOpacity = 1;
      if (isDay) starOpacity = 0;
      else if (t > 4 && t <= 6) starOpacity = 1 - (t - 4)/2;
      else if (t >= 18 && t < 20) starOpacity = (t - 18)/2;

      if (starOpacity > 0) {
        stars.forEach(s => {
          s.opacity += Math.sin(Date.now() * s.twinkleSpeed) * 0.05;
          if(s.opacity < 0.2) s.opacity = 0.2; if(s.opacity > 1) s.opacity = 1;

                                    : String(Math.max(1, Math.min(p.level || 1, profile.level - 1)))
        });
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const saveUser = async () => {
        const f = editForm; let patch;
        if (isAdmin(profile)) {
          const isRole = f.roleKey === 'admin' || f.roleKey === 'executive';
          patch = { name: f.name.trim(), username: f.username.trim() || null, department_id: f.department_id || null, disabled: f.disabled,
                    role: isRole ? f.roleKey : 'user', level: isRole ? 7 : Number(f.roleKey) };
        } else {
          const lvl = Number(f.roleKey);
          if (!profile.department_id) return addToast('You are not assigned to a department yet.', 'error');
          if (!(lvl >= 1 && lvl < profile.level)) return addToast(`You can only assign L1–L${profile.level - 1}.`, 'error');
          patch = { department_id: profile.department_id, level: lvl, role: 'user' };
        }
        const { error } = await supabase.from('profiles').update(patch).eq('id', editUser.id);
        if (error) return addToast(error.message, 'error');
        addToast(`${editUser.name} updated.`); setEditUser(null);
        if (editUser.id === profile.id) loadProfile(); else fetchData();
      };

      const sendReset = async (u) => {
        const { error } = await supabase.auth.resetPasswordForEmail(u.email, { redirectTo });
        addToast(error ? error.message : `Reset link sent to ${u.email}`, error ? 'error' : 'success');
      };

      const addDept = async () => {
        const name = newDeptName.trim(); if (!name) return;
        const { error } = await supabase.from('departments').insert([{ name }]);
        if (error) return addToast(error.message, 'error');
        setNewDeptName(''); fetchData(); addToast('Department added');
      };
      const renameDept = async (d) => {
        const name = prompt('Rename department:', d.name); if (!name || name.trim() === d.name) return;
        const { error } = await supabase.from('departments').update({ name: name.trim() }).eq('id', d.id);
        if (error) return addToast(error.message, 'error'); fetchData(); addToast('Renamed');
      };
      const deleteDept = async (d) => {
        if (!confirm(`Delete "${d.name}"? Members will become unassigned.`)) return;
        const { error } = await supabase.from('departments').delete().eq('id', d.id);
        if (error) return addToast(error.message, 'error'); fetchData(); addToast('Department removed');
      };

      /* =====================================================
         RENDER
         ===================================================== */
      const Toasts = () => (
        <div className="toast-container">
          {toasts.map(t => <div key={t.id} className={`toast ${t.type}`}>{t.type === 'error' ? '⚠️' : '✅'} {t.msg}</div>)}
        </div>
      );
      const BigBrand = () => (
        <div className="brand-header"><VectorLogo size={130} /><div className="brand-title">AEROBAY</div><div className="brand-subtitle">Work update</div></div>
      );

      if (booting) return <div><Toasts /><div style={{ marginTop: '5vh' }}><BigBrand /><div className="panel" style={{ textAlign: 'center', fontWeight: 800 }}>Connecting…</div></div></div>;

      /* ---- password recovery ---- */
      if (recoveryMode) return (
        <div><Toasts /><div style={{ marginTop: '5vh' }}><BigBrand />
          <div className="panel">
            <h2 style={{ fontSize: 18, marginBottom: 6 }}>Set a new password</h2>
            <div className="field-label">New Password</div>
            <input type="password" value={newPw} onChange={e => setNewPw(e.target.value)} placeholder="At least 6 characters" />
            <button className="btn-primary" onClick={handleSetNewPassword}>Update Password</button>
          </div></div></div>
      );

      /* ---- logged out ---- */
      if (!authUser) return (
        <div><Toasts />
          <div style={{ marginTop: '5vh' }}>
            <BigBrand />
            <div className="panel">
              <div className="tabs">
                <div className={'tab ' + (authMode === 'login' ? 'active' : '')} onClick={() => setAuthMode('login')}>Login</div>
                <div className={'tab ' + (authMode === 'signup' ? 'active' : '')} onClick={() => setAuthMode('signup')}>Register</div>
              </div>
              {authMode === 'login' ? (
                <div>
                  <div className="field-label">Email</div>
                  <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="you@company.com" />
                  <div className="field-label">Password</div>
                  <input type="password" value={pw} onChange={e => setPw(e.target.value)} placeholder="Magical world" onKeyDown={e => e.key === 'Enter' && handleLogin()} />
                  <div className="link" onClick={handleForgot}>Forgot password?</div>
                  <button className="btn-primary" onClick={handleLogin}>Access Portal</button>
                </div>
              ) : (
                <div>
                  <div className="field-label">Full Name</div>
                  <input value={fullName} onChange={e => setFullName(e.target.value)} placeholder="e.g. Shahidur Rahman" />
                  <div className="field-label">Email</div>
                  <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="you@company.com" />
                  <div className="field-label">Password</div>
                  <input type="password" value={pw} onChange={e => setPw(e.target.value)} placeholder="Magical world" />
                  <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 10, fontWeight: 600 }}>Your account starts as <b>Pending</b>. An Admin or your Manager will assign your department and level.</div>
                  <button className="btn-primary" onClick={handleSignup}>Register Account</button>
                </div>
              )}
              <div className="divider">or continue with</div>
              <button className="btn-google" onClick={handleGoogle}>
                <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.4 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.8-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.7-4.1-13.6-9.9l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
                Sign in with Google
              </button>
            </div>
          </div>
        </div>
      );

      if (!profile) return <div><Toasts /><div style={{ marginTop: '5vh' }}><BigBrand /><div className="panel" style={{ textAlign: 'center', fontWeight: 800 }}>Loading profile…</div></div></div>;

      /* ---- pending / disabled holding screen (Level 0: no data visible) ---- */
      if (!isActive(profile)) return (
        <div><Toasts />
          <div style={{ marginTop: '5vh' }}>
            <BigBrand />
            <div className="panel" style={{ textAlign: 'center' }}>
              <div style={{ fontSize: 44, marginBottom: 10 }}>{profile.disabled ? '⛔' : '⏳'}</div>
              <h2 style={{ fontSize: 20, marginBottom: 8 }}>{profile.disabled ? 'Account disabled' : 'Waiting for assignment'}</h2>
              <div style={{ color: 'var(--text-muted)', fontSize: 14, lineHeight: 1.6, fontWeight: 600 }}>
                {profile.disabled ? 'Your access has been disabled by an administrator.' : 'Your account is created but not yet activated. An Admin or your Team Manager will assign you to a department and level. This page refreshes automatically.'}
              </div>
              <div style={{ marginTop: 18, fontSize: 14 }}><b>{profile.name}</b><div style={{ color: 'var(--text-muted)', fontSize: 12 }}>{profile.email}</div></div>
              <div style={{ display: 'flex', gap: 10, justifyContent: 'center', marginTop: 22 }}>
                <button className="btn-small" onClick={loadProfile}>🔄 Check status</button>
                <button className="logout-btn" onClick={handleLogout}>Disconnect</button>
              </div>
            </div>
          </div>
        </div>
      );

      /* ---- main app ---- */
      const admin = isAdmin(profile);
      return (
        <div>
          <Toasts />
          <div className="brand-header" style={{ marginBottom: 24, flexDirection: 'row', justifyContent: 'center', alignItems: 'center', gap: '15px' }}>
            <VectorLogo size={55} /><div className="brand-title" style={{ fontSize: 28, marginTop: 0 }}>AEROBAY</div>
          </div>

          <div className="session-bar">
            <div>
              <div style={{ fontSize: 12, color: 'var(--text-muted)', marginBottom: 4, fontWeight: 'bold' }}>
                Logged in as
                {profile.role === 'user' && <span className="streak-badge" style={{ marginLeft: 10 }}>🔥 {calculateStreak()} Day Streak</span>}
                {iAmMissing && <span className="badge-missing" style={{ marginLeft: 8 }}>⚠ Missing log · {complianceDate.toLocaleDateString(undefined, { weekday: 'short' })}</span>}
              </div>
              <div style={{ fontSize: 16, color: 'var(--text-main)' }}>
                <b>{profile.name}</b>
                {admin ? <span className="admin-tag">Admin</span> : <span className="badge-level">{roleLabel(profile)}</span>}
              </div>
              <div style={{ fontSize: 13, color: '#0ea5e9', marginTop: 4, fontWeight: 'bold' }}>{isExec(profile) && !profile.department_id ? 'Management · Global visibility' : deptName(profile.department_id)}</div>
            </div>
            <button className="logout-btn" onClick={handleLogout}>Disconnect</button>
          </div>

          <div className="nav-bar">
            <div className={`nav-item ${activePage === 'feed' ? 'active' : ''}`} onClick={() => setActivePage('feed')}>🌐 Live Feed</div>
            <div className={`nav-item ${activePage === 'post' ? 'active' : ''}`} onClick={() => setActivePage('post')}>✍️ Submit Update</div>
            <div className={`nav-item ${activePage === 'download' ? 'active' : ''}`} onClick={() => setActivePage('download')}>📊 Reports</div>
            {canSeeUsersPage && <div className={`nav-item ${activePage === 'users' ? 'active' : ''}`} onClick={() => setActivePage('users')}>👥 Users {pendingCount > 0 && canManage(profile, { role: 'user', level: 0 }) ? `(${pendingCount} pending)` : ''}</div>}
            {admin && <div className={`nav-item ${activePage === 'admin' ? 'active' : ''}`} onClick={() => setActivePage('admin')}>🛡️ Admin Center</div>}
          </div>

          {/* ================= SUBMIT ================= */}
          {activePage === 'post' && (
            <div className="panel">
              <h2 style={{ fontSize: 18, marginBottom: 20 }}>Submit Daily Report</h2>
              <div className="field-label" style={{ marginTop: 0 }}>Work Date</div>
              <input type="date" value={selectedDate} max={fmtDate(new Date())} onChange={e => setSelectedDate(e.target.value)} />
              <div className="field-label" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end' }}>
                <span>Task Details</span>
                <span style={{ display: 'flex', gap: 8 }}>
                  <button onClick={previewAI} className="btn-mic" disabled={aiBusy || !postText.trim()} title="Convert to bullet points now">{aiBusy ? '✨ Working…' : '✨ AI Bullets'}</button>
                  <button onClick={toggleMic} className={`btn-mic ${isListening ? 'listening' : ''}`} title="Click to dictate">{isListening ? '🔴 Recording...' : '🎙️ Dictate'}</button>
                </span>
              </div>
              <textarea rows="7" placeholder="Type or dictate what you did today. AI will tidy it into bullet points before saving..." value={postText} onChange={e => { setPostText(e.target.value); setAiApplied(false); }} />
              <label className="check-row">
                <input type="checkbox" checked={autoAI} onChange={e => setAutoAI(e.target.checked)} /> Auto-summarise into structured bullets when publishing
                {aiApplied && <span className="badge-ok">✨ formatted{aiProvider ? ` · ${aiProvider}` : ''}</span>}
              </label>
              <button className="btn-primary" onClick={handlePost} disabled={!postText.trim() || aiBusy}>{aiBusy ? '✨ Summarising…' : '🚀 Publish Update'}</button>
            </div>
          )}

          {/* ================= REPORTS ================= */}
          {activePage === 'download' && (
            <div className="panel">
              <h2 style={{ fontSize: 18, marginBottom: 6 }}>Generate Reports</h2>
              <div style={{ fontSize: 12, color: 'var(--text-muted)', fontWeight: 600, marginBottom: 14 }}>
                Export scope: {isExec(profile) ? 'all departments, all levels' : profile.level >= 2 ? `you + L1–L${profile.level - 1} in ${deptName(profile.department_id)}` : 'your own work only'}
              </div>
              <div className="field-label" style={{ marginTop: 0 }}>Filter by Department / Branch</div>
              <select value={deptFilter} onChange={e => setDeptFilter(e.target.value)}>
                <option value="ALL">{isExec(profile) ? 'All Departments (Global)' : 'My visible scope'}</option>
                {(isExec(profile) ? departments : departments.filter(d => d.id === profile.department_id)).map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
              </select>
              <div className="field-label">Select Month</div>
              <input type="month" value={downloadMonth} onChange={e => setDownloadMonth(e.target.value)} />
              <button className="btn-primary" style={{ background: 'linear-gradient(135deg, #10b981, #059669)' }} onClick={exportExcel}>⬇️ Download .XLSX (per-department sheets + missing logs)</button>
            </div>
          )}

          {/* ================= USERS ================= */}
          {activePage === 'users' && canSeeUsersPage && (
            <div>
              {editUser && (
                <div className="panel" style={{ border: '1px solid #818cf8' }}>
                  <h2 style={{ fontSize: 18, marginBottom: 4, color: '#818cf8' }}>Manage · {editUser.name}</h2>
                  <div style={{ fontSize: 13, color: 'var(--text-muted)', fontWeight: 600 }}>{editUser.email} · currently {roleLabel(editUser)}</div>
                  {admin && (<div>
                    <div className="field-label">Full Name</div>
                    <input value={editForm.name} onChange={e => setEditForm({ ...editForm, name: e.target.value })} />
                    <div className="field-label">User ID / Handle</div>
                    <input value={editForm.username} onChange={e => setEditForm({ ...editForm, username: e.target.value })} placeholder="e.g. sr" />
                  </div>)}
                  <div className="field-label">Department / Branch</div>
                  {admin
                    ? <select value={editForm.department_id} onChange={e => setEditForm({ ...editForm, department_id: e.target.value })}><option value="">— None —</option>{departments.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}</select>
                    : <input value={deptName(profile.department_id)} disabled />}
                  <div className="field-label">Level / Role</div>
                  <select value={editForm.roleKey} onChange={e => setEditForm({ ...editForm, roleKey: e.target.value })}>{roleOptions.map(([v, l]) => <option key={v} value={v}>{l}</option>)}</select>
                  {!admin && <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 8, fontWeight: 600 }}>As {roleLabel(profile)} you can assign L1–L{profile.level - 1} inside {deptName(profile.department_id)} only.</div>}
                  {admin && <label className="check-row"><input type="checkbox" checked={editForm.disabled} onChange={e => setEditForm({ ...editForm, disabled: e.target.checked })} /> Account disabled</label>}
                  <button className="btn-primary" onClick={saveUser}>💾 Save Assignment</button>
                  <div style={{ display: 'flex', gap: 10, marginTop: 12, flexWrap: 'wrap' }}>
                    {admin && <button className="btn-small" onClick={() => sendReset(editUser)}>📧 Send password reset</button>}
                    <button className="btn-small danger" onClick={() => setEditUser(null)}>Cancel</button>
                  </div>
                </div>
              )}

              <div className="panel">
                <h2 style={{ fontSize: 18, marginBottom: 14 }}>User Directory</h2>
                <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search by name, email, department or role…" />
                <div className="tabs" style={{ marginTop: 14, marginBottom: 0 }}>
                  <div className={'tab ' + (!pendingOnly ? 'active' : '')} onClick={() => setPendingOnly(false)}>All Visible ({profiles.length})</div>
                  <div className={'tab ' + (pendingOnly ? 'active' : '')} onClick={() => setPendingOnly(true)}>⏳ Pending Pool ({pendingCount})</div>
                </div>
                <div style={{ overflowX: 'auto' }}>
                  <table className="user-table">
                    <thead><tr><th>Name</th><th>Email</th><th>Department</th><th>Role</th><th>Status</th><th></th></tr></thead>
                    <tbody>
                      {userRows.length === 0 && <tr><td colSpan="6" style={{ textAlign: 'center', color: 'var(--text-muted)' }}>No users match.</td></tr>}
                      {userRows.map(u => (
                        <tr key={u.id}>
                          <td><b>{u.name}</b>{u.username && <div style={{ fontSize: 11, color: 'var(--text-muted)' }}>@{u.username}</div>}</td>
                          <td>{u.email}</td>
                          <td>{deptName(u.department_id)}</td>
                          <td>{roleLabel(u)}</td>
                          <td>{u.disabled ? <span className="badge-missing">Disabled</span> : isPending(u) ? <span className="badge-level" style={{ marginLeft: 0 }}>Pending</span> : missingSet.has(u.id) ? <span className="badge-missing">⚠ Missing Log</span> : <span className="badge-ok">Active</span>}</td>
                          <td>{canManage(profile, u) && <button className="btn-small" onClick={() => openEdit(u)}>{isPending(u) ? 'Activate' : 'Manage'}</button>}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {/* ================= ADMIN CENTER ================= */}
          {activePage === 'admin' && admin && (
            <div className="panel" style={{ border: '1px solid #818cf8' }}>
              <h2 style={{ fontSize: 18, marginBottom: 14, color: '#818cf8' }}>Departments / Branches</h2>
              <div style={{ display: 'flex', gap: 10 }}>
                <input value={newDeptName} onChange={e => setNewDeptName(e.target.value)} placeholder="New department name" onKeyDown={e => e.key === 'Enter' && addDept()} />
                <button className="btn-small" onClick={addDept}>➕ Add</button>
              </div>
              <table className="user-table">
                <thead><tr><th>Name</th><th>Members</th><th>Actions</th></tr></thead>
                <tbody>
                  {departments.map(d => (
                    <tr key={d.id}>
                      <td><b>{d.name}</b></td>
                      <td>{profiles.filter(p => p.department_id === d.id).length}</td>
                      <td style={{ display: 'flex', gap: 8 }}><button className="btn-small" onClick={() => renameDept(d)}>Rename</button><button className="btn-small danger" onClick={() => deleteDept(d)}>Delete</button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 16, fontWeight: 600 }}>User activation, levels, disabling and password resets are in <b>👥 Users</b>.</div>
            </div>
          )}

          {/* ================= FEED ================= */}
          {activePage === 'feed' && (
            <div>
              {/* Daily compliance (Mon–Fri only, hierarchy-scoped) */}
              <div className="panel" style={{ padding: 20, borderLeft: `5px solid ${missingUsers.length ? '#ef4444' : '#10b981'}` }}>
                <div className="field-label" style={{ marginTop: 0 }}>Daily compliance · {complianceDate.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'short' })}</div>
                {missingUsers.length === 0
                  ? <span className="badge-ok">✅ Everyone in your line submitted their log</span>
                  : <div>{missingUsers.map(p => <span className="chip" key={p.id}>⚠ {p.id === profile.id ? 'You' : p.name}<span style={{ opacity: .75, fontWeight: 600 }}>· {deptName(p.department_id)} · L{p.level}</span></span>)}</div>}
              </div>

              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12, marginBottom: 16 }}>
                <div style={{ fontSize: 14, fontWeight: 800, color: 'var(--text-muted)', textTransform: 'uppercase', letterSpacing: '1px' }}>
                  {isExec(profile) ? 'Global Activity Feed' : profile.level >= 2 ? `${deptName(profile.department_id)} · L1–L${profile.level - 1} + You` : 'My Activity'}
                </div>
                {isExec(profile) && (
                  <select style={{ width: 'auto', padding: '8px 12px', fontSize: 13 }} value={deptFilter} onChange={e => setDeptFilter(e.target.value)}>
                    <option value="ALL">All departments</option>{departments.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
                  </select>
                )}
              </div>

              {loading ? (
                <div><div className="skeleton"></div><div className="skeleton"></div></div>
              ) : feedEntries.length === 0 ? (
                <div style={{ textAlign: 'center', color: 'var(--text-muted)', padding: 40, fontWeight: 'bold' }}>No activity recorded yet.</div>
              ) : feedGroups.map(([deptId, list]) => (
                <div key={deptId}>
                  <div className="dept-heading">🏷 {deptName(deptId)} <span style={{ opacity: .6 }}>· {list.length}</span></div>
                  {list.map((e, index) => { const p = byId[e.owner_id]; return (
                    <div className="entry" key={e.id} style={{ animationDelay: `${Math.min(index, 8) * 0.06}s` }}>
                      <div className="entry-meta">
                        <div>
                          <span className="entry-author">{p?.name || e.author}</span>
                          <span className="entry-team">{shortLevel(p) || '—'}</span>
                          {missingSet.has(e.owner_id) && <span className="badge-missing" style={{ marginLeft: 8 }}>⚠ Missing Log</span>}
                        </div>
                        <span className="entry-date-badge">📅 {e.work_date}</span>
                      </div>
                      <div className="entry-text">{e.text}</div>
                      {(admin || profile.id === e.owner_id) && (
                        <div style={{ marginTop: 16, textAlign: 'right' }}>
                          <button className="del-btn" onClick={async () => { if (!confirm('Remove this entry?')) return; const { error } = await supabase.from('entries').delete().eq('id', e.id); if (error) return addToast(error.message, 'error'); fetchData(); addToast('Post removed.'); }}>Remove Entry</button>
                        </div>
                      )}
                    </div>
                  ); })}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
