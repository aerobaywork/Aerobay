<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <title>Aerobay - Spaceport & Work Update Portal</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap');

    /* --- AEROSPACE MISSION CONTROL DYNAMIC THEME --- */
    :root {
      --text-main: #0f172a;
      --text-muted: #334155;
      --glass-bg: rgba(255, 255, 255, 0.74);
      --glass-border: rgba(255, 255, 255, 0.92);
      --glass-highlight: rgba(255, 255, 255, 0.85);
      --input-bg: rgba(255, 255, 255, 0.86);
      --input-border: rgba(14, 165, 233, 0.45);
      --card-bg: rgba(255, 255, 255, 0.82);
      --card-hover: rgba(255, 255, 255, 0.96);
      --shadow: rgba(2, 6, 23, 0.18);
      --btn-grad-1: #0ea5e9;
      --btn-grad-2: #2563eb;
      --hud-accent: #0284c7;
      --hud-corner: rgba(2, 132, 199, 0.65);
    }

    [data-theme="dark"] {
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --glass-bg: rgba(9, 15, 32, 0.68);
      --glass-border: rgba(56, 189, 248, 0.28);
      --glass-highlight: rgba(255, 255, 255, 0.12);
      --input-bg: rgba(2, 6, 23, 0.62);
      --input-border: rgba(56, 189, 248, 0.45);
      --card-bg: rgba(15, 23, 42, 0.64);
      --card-hover: rgba(30, 41, 59, 0.82);
      --shadow: rgba(0, 0, 0, 0.62);
      --btn-grad-1: #0284c7;
      --btn-grad-2: #1d4ed8;
      --hud-accent: #38bdf8;
      --hud-corner: rgba(56, 189, 248, 0.75);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #020617;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      transition: color 0.35s ease;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }

    /* THE CANVAS DYNAMIC AEROBAY SPACEPORT HUB */
    #canvas-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: auto;
      touch-action: manipulation;
    }

    #root {
      width: 100%;
      max-width: 780px;
      padding: 20px 16px 210px;
      position: relative;
      z-index: 2;
      pointer-events: none;
    }

    #root * {
      pointer-events: auto;
    }

    /* TOP TELEMETRY STATUS STRIP */
    .telemetry-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(5, 11, 26, 0.82);
      border: 1px solid rgba(56, 189, 248, 0.42);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 7px 14px;
      border-radius: 999px;
      margin-bottom: 16px;
      font-size: 11px;
      font-weight: 700;
      color: #e2e8f0;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      flex-wrap: wrap;
    }

    .telemetry-group {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .telemetry-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: #bae6fd;
      letter-spacing: 0.4px;
    }

    /* AEROBAY MISSION CONTROL ENVIRONMENT DOCK (PC & SMARTPHONE ERGONOMIC) */
    .time-controller {
      position: fixed;
      bottom: max(12px, env(safe-area-inset-bottom, 12px));
      left: 50%;
      transform: translateX(-50%);
      background: rgba(6, 12, 28, 0.88);
      border: 1.5px solid rgba(56, 189, 248, 0.55);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      padding: 10px 16px;
      border-radius: 22px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.68), 0 0 24px rgba(14, 165, 233, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      width: 95%;
      max-width: 750px;
      color: #f8fafc;
    }

    .time-controller.dock-minimized {
      padding: 7px 14px;
      border-radius: 999px;
      max-width: 540px;
    }

    .time-controller.dock-minimized .env-bottom-row {
      display: none;
    }

    .env-top-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }

    .env-bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      border-top: 1px solid rgba(148, 163, 184, 0.22);
      padding-top: 8px;
    }

    .env-pill-group {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    .env-pill {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(148, 163, 184, 0.28);
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.18s ease;
      letter-spacing: 0.3px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      user-select: none;
    }

    .env-pill:hover {
      background: rgba(56, 189, 248, 0.22);
      color: #fff;
      border-color: #38bdf8;
      transform: translateY(-1px);
    }

    .env-pill:active {
      transform: scale(0.96);
    }

    .env-pill.active {
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      color: #fff;
      border-color: #7dd3fc;
      box-shadow: 0 0 14px rgba(14, 165, 233, 0.55);
    }

    .env-pill.sound-pill.active-sfx {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      border-color: #6ee7b7;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.45);
    }

    .env-pill.sound-pill.muted {
      background: rgba(239, 68, 68, 0.16);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.45);
    }

    .env-pill.launch-btn {
      background: linear-gradient(135deg, #f97316, #dc2626);
      color: #fff;
      border-color: #fdba74;
      box-shadow: 0 0 14px rgba(249, 115, 22, 0.5);
    }

    .env-pill.launch-btn:hover {
      transform: translateY(-1px) scale(1.04);
      box-shadow: 0 0 20px rgba(249, 115, 22, 0.85);
    }

    .crew-counter-pill {
      font-size: 11px;
      font-weight: 800;
      color: #38bdf8;
      background: rgba(14, 165, 233, 0.16);
      border: 1px solid rgba(56, 189, 248, 0.45);
      padding: 4px 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .dock-toggle-btn {
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #bae6fd;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }

    .dock-toggle-btn:hover {
      background: rgba(56, 189, 248, 0.3);
      color: #fff;
    }

    .time-label {
      font-size: 14px;
      font-weight: 900;
      color: #f8fafc;
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
      min-width: 46px;
      text-align: center;
    }

    .time-slider {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, #090d1e 0%, #f43f5e 24%, #38bdf8 50%, #f59e0b 76%, #090d1e 100%);
      outline: none;
      transition: 0.3s;
      border: 1px solid rgba(255, 255, 255, 0.35);
      cursor: pointer;
    }

    .time-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fef08a, #f59e0b);
      cursor: pointer;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.95);
      border: 2px solid #ffffff;
      transition: transform 0.15s ease;
    }

    .time-slider::-webkit-slider-thumb:hover {
      transform: scale(1.18);
    }

    /* CREATIVE HIGH-CONTRAST AEROBAY COMMAND HEADER & LOGO BADGE */
    .brand-header {
      text-align: center;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .brand-crest-shell {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(155deg, rgba(6, 12, 30, 0.90), rgba(15, 23, 42, 0.82));
      border: 2px solid rgba(56, 189, 248, 0.82);
      box-shadow:
        0 0 0 4px rgba(15, 23, 42, 0.5),
        0 18px 42px rgba(2, 6, 23, 0.72),
        0 0 32px rgba(56, 189, 248, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.38);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 18px 36px 16px;
      border-radius: 28px;
    }

    .brand-crest-shell::before,
    .brand-crest-shell::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 12px;
      height: 32px;
      transform: translateY(-50%);
      border: 2px solid #38bdf8;
      opacity: 0.88;
    }

    .brand-crest-shell::before {
      left: 10px;
      border-right: none;
      border-radius: 8px 0 0 8px;
    }

    .brand-crest-shell::after {
      right: 10px;
      border-left: none;
      border-radius: 0 8px 8px 0;
    }

    .brand-compact-bar {
      display: inline-flex;
      flex-direction: row;
      align-items: center;
      gap: 16px;
      background: linear-gradient(145deg, rgba(6, 12, 30, 0.90), rgba(15, 23, 42, 0.84));
      border: 2px solid rgba(56, 189, 248, 0.82);
      box-shadow:
        0 0 0 3px rgba(15, 23, 42, 0.45),
        0 12px 32px rgba(2, 6, 23, 0.6),
        0 0 24px rgba(56, 189, 248, 0.38);
      padding: 10px 26px;
      border-radius: 999px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .brand-title {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 7px;
      background: linear-gradient(180deg, #ffffff 0%, #bae6fd 45%, #38bdf8 80%, #a78bfa 100%);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      margin-top: 8px;
      -webkit-text-stroke: 1px rgba(56, 189, 248, 0.45);
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.95)) drop-shadow(0 0 16px rgba(56, 189, 248, 0.65));
    }

    .brand-subtitle {
      font-size: 11px;
      color: #e2e8f0;
      margin-top: 6px;
      font-weight: 800;
      letter-spacing: 2.6px;
      text-transform: uppercase;
      background: rgba(14, 165, 233, 0.24);
      border: 1px solid rgba(125, 211, 252, 0.58);
      padding: 4px 14px;
      border-radius: 999px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      display: inline-block;
      animation: pulse 1.5s infinite;
    }

    /* AEROSPACE HUD GLASS PANELS */
    .panel {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-highlight);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 16px 38px var(--shadow);
      transition: all 0.3s ease;
    }

    .panel::before,
    .panel::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      pointer-events: none;
      opacity: 0.7;
    }

    .panel::before {
      top: 8px;
      left: 8px;
      border-top: 2px solid var(--hud-corner);
      border-left: 2px solid var(--hud-corner);
      border-top-left-radius: 6px;
    }

    .panel::after {
      bottom: 8px;
      right: 8px;
      border-bottom: 2px solid var(--hud-corner);
      border-right: 2px solid var(--hud-corner);
      border-bottom-right-radius: 6px;
    }

    /* TABS */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab {
      flex: 1;
      text-align: center;
      padding: 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.22s ease;
      backdrop-filter: blur(10px);
      user-select: none;
    }
    .tab.active {
      background: linear-gradient(135deg, var(--btn-grad-1), var(--btn-grad-2));
      color: white;
      border-color: #38bdf8;
      box-shadow: 0 0 20px rgba(14, 165, 233, 0.45);
    }

    /* NAV BAR */
    .nav-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .nav-bar::-webkit-scrollbar { display: none; }
    .nav-item {
      padding: 11px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      user-select: none;
    }
    .nav-item:hover {
      border-color: #38bdf8;
      transform: translateY(-1px);
    }
    .nav-item.active {
      background: linear-gradient(135deg, var(--btn-grad-1), var(--btn-grad-2));
      color: white;
      border-color: #38bdf8;
      box-shadow: 0 6px 18px rgba(14, 165, 233, 0.45);
    }

    /* FORMS (16px font on mobile prevents iOS auto-zoom) */
    .field-label {
      font-size: 11.5px;
      color: var(--text-main);
      opacity: 0.92;
      margin: 16px 0 8px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 13px 14px;
      font-size: 16px;
      outline: none;
      background: var(--input-bg);
      color: var(--text-main);
      transition: 0.22s;
      backdrop-filter: blur(10px);
    }
    input:focus, select:focus, textarea:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.24);
    }

    /* BUTTONS */
    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, var(--btn-grad-1), var(--btn-grad-2));
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 800;
      margin-top: 20px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.22s ease;
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.42);
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(37, 99, 235, 0.7);
    }
    .btn-primary:active:not(:disabled) {
      transform: translateY(0) scale(0.99);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      box-shadow: none;
      transform: none;
      cursor: not-allowed;
    }

    .btn-mic {
      background: var(--input-bg);
      border: 1px solid #0ea5e9;
      color: #0ea5e9;
      border-radius: 9px;
      padding: 9px 13px;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 12.5px;
      margin-bottom: 8px;
      backdrop-filter: blur(6px);
    }
    .btn-mic:hover:not(:disabled) {
      background: rgba(14, 165, 233, 0.15);
    }
    .btn-mic.listening {
      background: #ef4444;
      color: white;
      border-color: #ef4444;
      animation: pulse 1.5s infinite;
    }
    .btn-mic:disabled { opacity: 0.5; cursor: not-allowed; }

    /* SESSION & STREAK */
    .session-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      background: var(--glass-bg);
      border-radius: 18px;
      padding: 16px 20px;
      margin-bottom: 18px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 12px 32px var(--shadow);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }
    .streak-badge {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: white;
      font-size: 11.5px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.45);
    }
    .admin-tag {
      background: #4f46e5;
      color: white;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      margin-left: 8px;
      text-transform: uppercase;
    }
    .logout-btn {
      background: rgba(239, 68, 68, 0.16);
      border: 1px solid rgba(239, 68, 68, 0.5);
      border-radius: 10px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 800;
      color: #ef4444;
      cursor: pointer;
      transition: 0.2s;
      backdrop-filter: blur(5px);
    }
    .logout-btn:hover { background: #ef4444; color: white; }

    /* FEED ENTRIES WITH ANIMATION */
    .entry {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-left: 5px solid #0ea5e9;
      border-radius: 16px;
      padding: 18px 20px;
      margin-bottom: 14px;
      transition: 0.22s;
      box-shadow: 0 8px 25px var(--shadow);
      animation: slideUp 0.38s ease forwards;
      opacity: 0;
      transform: translateY(18px);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .entry:hover {
      transform: translateX(4px) translateY(0) !important;
      background: var(--card-hover);
    }
    .entry-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
    .entry-author { font-size: 15.5px; font-weight: 800; color: var(--text-main); }
    .entry-team {
      font-size: 11px;
      font-weight: 800;
      color: #0284c7;
      background: rgba(2, 132, 199, 0.15);
      border-radius: 6px;
      padding: 3px 9px;
      margin-left: 8px;
      text-transform: uppercase;
      border: 1px solid rgba(2, 132, 199, 0.4);
    }
    [data-theme="dark"] .entry-team { color: #38bdf8; border-color: rgba(56, 189, 248, 0.4); }
    .entry-date-badge {
      font-size: 12px;
      color: var(--text-main);
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      background: var(--input-bg);
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--glass-border);
    }
    .entry-text { font-size: 15px; line-height: 1.7; color: var(--text-main); opacity: 0.94; white-space: pre-wrap; word-break: break-word; }
    .del-btn { color: #ef4444; background: none; border: none; font-weight: 800; font-size: 12px; text-transform: uppercase; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
    .del-btn:hover { background: rgba(239, 68, 68, 0.14); }

    /* TOASTS */
    .toast-container { position: fixed; top: 16px; right: 16px; left: 16px; pointer-events: none; z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
    .toast {
      pointer-events: auto;
      background: rgba(9, 15, 32, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.5);
      backdrop-filter: blur(18px);
      color: #f8fafc;
      padding: 13px 18px;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
      font-weight: 700;
      font-size: 13px;
      animation: slideInRight 0.28s ease forwards;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 100%;
    }
    .toast.error { border-left: 5px solid #ef4444; }

  <script>
    /* ============================================================================
       ADVANCED WEB AUDIO API ACOUSTIC & SOUND EFFECTS ENGINE (PC & SMARTPHONE)
       ============================================================================ */
    let audioCtx = null;
    let masterGain = null;
    let sfxGain = null;
    let ambGain = null;
    let sharedNoiseBuffer = null;
    let rainNode = null;
    let rainFilter = null;
    let rainGainNode = null;
    let padDroneOsc1 = null;
    let padDroneOsc2 = null;
    let padDroneGain = null;

    // Modes: 'ALL' (SFX + Ambience), 'SFX' (SFX Only), 'MUTE' (Muted)
    window.soundMode = localStorage.getItem('aerobay_sound_mode') || 'ALL';

    function createPinkNoiseBuffer(ctx, seconds = 3) {
      const bufferSize = ctx.sampleRate * seconds;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const output = buffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.045;
        b6 = white * 0.115926;
      }
      return buffer;
    }

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        audioCtx = new AudioContextClass();

        masterGain = audioCtx.createGain();
        sfxGain = audioCtx.createGain();
        ambGain = audioCtx.createGain();

        sfxGain.connect(masterGain);
        ambGain.connect(masterGain);
        masterGain.connect(audioCtx.destination);

        sharedNoiseBuffer = createPinkNoiseBuffer(audioCtx, 4);
        setupAmbientLoops();
        applySoundModeGains();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
    }

    function setupAmbientLoops() {
      if (!audioCtx || !sharedNoiseBuffer) return;

      // 1. Continuous Weather Rain / Wind Generator
      rainNode = audioCtx.createBufferSource();
      rainNode.buffer = sharedNoiseBuffer;
      rainNode.loop = true;

      rainFilter = audioCtx.createBiquadFilter();
      rainFilter.type = 'bandpass';
      rainFilter.frequency.value = 950;
      rainFilter.Q.value = 0.7;

      rainGainNode = audioCtx.createGain();
      rainGainNode.gain.value = 0.0001;

      rainNode.connect(rainFilter);
      rainFilter.connect(rainGainNode);
      rainGainNode.connect(ambGain);
      rainNode.start();

      // 2. Subtle Spaceport Telemetry Harmonic Pad Drone
      padDroneOsc1 = audioCtx.createOscillator();
      padDroneOsc2 = audioCtx.createOscillator();
      const droneFilter = audioCtx.createBiquadFilter();
      padDroneGain = audioCtx.createGain();

      padDroneOsc1.type = 'sine';
      padDroneOsc2.type = 'triangle';
      padDroneOsc1.frequency.value = 55; // A1 sub harmonic
      padDroneOsc2.frequency.value = 110.2; // Binaural fifth/octave shimmer

      droneFilter.type = 'lowpass';
      droneFilter.frequency.value = 220;
      padDroneGain.gain.value = 0.015;

      padDroneOsc1.connect(droneFilter);
      padDroneOsc2.connect(droneFilter);
      droneFilter.connect(padDroneGain);
      padDroneGain.connect(ambGain);

      padDroneOsc1.start();
      padDroneOsc2.start();
      updateWeatherAmbience();
    }

    function applySoundModeGains() {
      const btn = document.getElementById('sound-mode-btn');
      if (btn) {
        btn.classList.remove('active', 'active-sfx', 'muted');
        if (window.soundMode === 'ALL') {
          btn.innerHTML = '🔊 SFX+AMB';
          btn.classList.add('active');
        } else if (window.soundMode === 'SFX') {
          btn.innerHTML = '🔉 SFX Only';
          btn.classList.add('active-sfx');
        } else {
          btn.innerHTML = '🔇 Muted';
          btn.classList.add('muted');
        }
      }
      if (!audioCtx || !masterGain) return;
      const now = audioCtx.currentTime;
      if (window.soundMode === 'MUTE') {
        masterGain.gain.setTargetAtTime(0.0001, now, 0.04);
      } else if (window.soundMode === 'SFX') {
        masterGain.gain.setTargetAtTime(1.0, now, 0.04);
        sfxGain.gain.setTargetAtTime(1.0, now, 0.04);
        ambGain.gain.setTargetAtTime(0.0001, now, 0.08);
      } else {
        masterGain.gain.setTargetAtTime(1.0, now, 0.04);
        sfxGain.gain.setTargetAtTime(1.0, now, 0.04);
        ambGain.gain.setTargetAtTime(1.0, now, 0.15);
      }
      updateWeatherAmbience();
    }

    function updateWeatherAmbience() {
      if (!audioCtx || !rainGainNode || !rainFilter || !padDroneGain) return;
      const now = audioCtx.currentTime;
      const mode = window.weatherMode || 'clear';
      if (mode === 'rain') {

        rainFilter.frequency.setTargetAtTime(800, now, 0.3);
        rainGainNode.gain.setTargetAtTime(0.32, now, 0.4);
      } else if (mode === 'snow') {
        rainFilter.frequency.setTargetAtTime(420, now, 0.3);
        rainGainNode.gain.setTargetAtTime(0.04, now, 0.4);
      } else {
        rainGainNode.gain.setTargetAtTime(0.008, now, 0.4);

        padDroneOsc2.frequency.setTargetAtTime(164.81, now, 0.5);
        padDroneGain.gain.setTargetAtTime(0.032, now, 0.5);

        padDroneOsc2.frequency.setTargetAtTime(110.2, now, 0.5);

      subOsc.frequency.exponentialRampToValueAtTime(92, now + 1.4);
      subOsc.frequency.exponentialRampToValueAtTime(52, now + 4.2);

      subOsc2.frequency.setValueAtTime(28, now);
      subOsc2.frequency.exponentialRampToValueAtTime(64, now + 1.8);

      subFilter.type = 'lowpass';
      subFilter.frequency.setValueAtTime(160, now);
      subFilter.frequency.exponentialRampToValueAtTime(420, now + 2.0);
      subFilter.frequency.exponentialRampToValueAtTime(140, now + 4.3);

      subGain.gain.setValueAtTime(0.001, now);
      subGain.gain.linearRampToValueAtTime(0.18, now + 0.35);
      subGain.gain.setValueAtTime(0.18, now + 2.1);
      subGain.gain.exponentialRampToValueAtTime(0.001, now + 4.4);

      subOsc.connect(subFilter);
      subOsc2.connect(subFilter);
      subFilter.connect(subGain);
      subGain.connect(sfxGain);
      subOsc.start(now);
      subOsc2.start(now);
      subOsc.stop(now + 4.5);
      subOsc2.stop(now + 4.5);

      // Layer B: Jet Plume Roar & Water Deluge Steam Hiss (Filtered Pink Noise Sweep)
      if (sharedNoiseBuffer) {
        const noise = audioCtx.createBufferSource();
        noise.buffer = sharedNoiseBuffer;
        noise.loop = true;

        const roarFilter = audioCtx.createBiquadFilter();
        roarFilter.type = 'bandpass';
        roarFilter.Q.value = 0.65;
        roarFilter.frequency.setValueAtTime(180, now);
        roarFilter.frequency.exponentialRampToValueAtTime(1250, now + 1.6);
        roarFilter.frequency.exponentialRampToValueAtTime(320, now + 4.3);

        const roarGain = audioCtx.createGain();
        roarGain.gain.setValueAtTime(0.001, now);
        roarGain.gain.linearRampToValueAtTime(0.38, now + 0.4);
        roarGain.gain.exponentialRampToValueAtTime(0.001, now + 4.4);

        noise.connect(roarFilter);
        roarFilter.connect(roarGain);
        roarGain.connect(sfxGain);
        noise.start(now);
        noise.stop(now + 4.45);
      }

      // Layer C: Characteristic Heavy-Lift Acoustic Exhaust Crackle Bursts
      for (let i = 0; i < 24; i++) {
        const crackleTime = now + 0.35 + i * 0.14 + Math.random() * 0.08;
        const cOsc = audioCtx.createOscillator();
        const cGain = audioCtx.createGain();
        cOsc.type = 'square';
        cOsc.frequency.setValueAtTime(90 + Math.random() * 220, crackleTime);
        cOsc.frequency.exponentialRampToValueAtTime(38, crackleTime + 0.045);
        const amp = Math.max(0.01, (1 - i / 26) * 0.065);
        cGain.gain.setValueAtTime(amp, crackleTime);
        cGain.gain.exponentialRampToValueAtTime(0.0008, crackleTime + 0.05);
        cOsc.connect(cGain);
        cGain.connect(sfxGain);
        cOsc.start(crackleTime);
        cOsc.stop(crackleTime + 0.055);
      }
    };

    // 10. Reusable Booster Double Sonic Boom & Landing Burn Thud
    window.playBoosterSonicBoom = function() {
      if (!audioCtx || window.soundMode === 'MUTE') return;
      const now = audioCtx.currentTime;
      // Twin Sonic Booms ("BA-BOOM!")
      [0, 0.22].forEach((offset, idx) => {
        const t = now + offset;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(idx === 0 ? 95 : 78, t);
        osc.frequency.exponentialRampToValueAtTime(24, t + 0.32);
        gain.gain.setValueAtTime(0.22, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        osc.connect(gain);

        osc.start(t);

        g.gain.linearRampToValueAtTime(0.32, now + 0.08);
        g.gain.exponentialRampToValueAtTime(0.001, now + 2.5);

        src.connect(filt);

        g.connect(sfxGain);
        src.start(now);
        src.stop(now + 2.55);

      ctx.globalAlpha = opacity;
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.arc(x + size * 0.78, y - size * 0.25, size * 0.78, 0, Math.PI * 2);
      ctx.arc(x + size * 1.48, y + size * 0.04, size * 0.85, 0, Math.PI * 2);
      ctx.arc(x - size * 0.65, y + size * 0.12, size * 0.68, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawAurora(isNightOrDusk) {
      if (window.weatherMode !== 'aurora' && !(isNightOrDusk && window.skyTime < 4.5)) return;
      const intensity = window.weatherMode === 'aurora' ? 0.52 : 0.2;
      const nowMs = Date.now() * 0.001;
      ctx.save();
      for (let band = 0; band < 3; band++) {
        const grad = ctx.createLinearGradient(0, height * 0.04, width, height * 0.48);
        if (band === 0) {
          grad.addColorStop(0, `rgba(16, 185, 129, 0)`);
          grad.addColorStop(0.3, `rgba(16, 185, 129, ${intensity})`);
          grad.addColorStop(0.7, `rgba(56, 189, 248, ${intensity * 0.9})`);
          grad.addColorStop(1, `rgba(139, 92, 246, 0)`);
        } else if (band === 1) {
          grad.addColorStop(0, `rgba(139, 92, 246, 0)`);
          grad.addColorStop(0.4, `rgba(168, 85, 247, ${intensity * 0.75})`);
          grad.addColorStop(0.8, `rgba(16, 185, 129, ${intensity * 0.6})`);
          grad.addColorStop(1, `rgba(16, 185, 129, 0)`);
        } else {
          grad.addColorStop(0, `rgba(56, 189, 248, 0)`);
          grad.addColorStop(0.5, `rgba(45, 212, 191, ${intensity * 0.6})`);
          grad.addColorStop(1, `rgba(56, 189, 248, 0)`);
        }
        ctx.fillStyle = grad;
        ctx.beginPath();
        const baseY = height * (0.13 + band * 0.07);
        ctx.moveTo(0, baseY);
        for (let x = 0; x <= width; x += 36) {
          const wave = Math.sin(x * 0.004 + nowMs * (0.8 + band * 0.3) + band) * 28 +
                       Math.cos(x * 0.009 - nowMs * 0.5) * 14;
          ctx.lineTo(x, baseY + wave);
        }
        ctx.lineTo(width, baseY + 100);
        ctx.lineTo(0, baseY + 100);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    // Orbiting Aerobay Space Station in the upper sky

      const satX = ((nowSec * 22) % (width + 240)) - 120;

      ctx.save();

      // Solar Array Wings
      ctx.fillStyle = isDay ? '#0284c7' : '#38bdf8';
      ctx.strokeStyle = '#e0f2fe';
      ctx.lineWidth = 1;
      ctx.fillRect(-36, -6, 23, 12);
      ctx.strokeRect(-36, -6, 23, 12);
      ctx.fillRect(13, -6, 23, 12);
      ctx.strokeRect(13, -6, 23, 12);

      // Central Truss & Core Module
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(-9, -3.5, 18, 7);
      ctx.fillStyle = '#10b981';
      ctx.beginPath();
      ctx.arc(0, 0, 2.2, 0, Math.PI * 2);

    function drawAerobaySpaceport(isDay, isNight, sunAngle) {
      const groundY = height - 68;
      const horizonY = height - 124;
      const nowSec = Date.now() * 0.001;

      // 1. DISTANT LAYERED MOUNTAINS & COASTAL BAY WATER
      ctx.fillStyle = isDay ? '#1e3a5f' : '#050d1e';
      ctx.beginPath();
      ctx.moveTo(0, horizonY);
      ctx.lineTo(width * 0.12, horizonY - 48);
      ctx.lineTo(width * 0.27, horizonY - 19);
      ctx.lineTo(width * 0.48, horizonY - 64);
      ctx.lineTo(width * 0.68, horizonY - 24);
      ctx.lineTo(width * 0.86, horizonY - 54);
      ctx.lineTo(width, horizonY - 22);
      ctx.lineTo(width, horizonY);
      ctx.closePath();
      ctx.fill();

      // Coastal Spaceport Water Bay with Shimmer & Building Reflections
      const waterGrad = ctx.createLinearGradient(0, horizonY, 0, groundY);
      if (isDay) {
        waterGrad.addColorStop(0, '#0284c7');
        waterGrad.addColorStop(1, '#0369a1');
      } else {
        waterGrad.addColorStop(0, '#07142e');
        waterGrad.addColorStop(1, '#020617');
      }
      ctx.fillStyle = waterGrad;
      ctx.fillRect(0, horizonY, width, groundY - horizonY);

      // Shimmering water reflection lines
      ctx.strokeStyle = isDay ? 'rgba(224, 242, 254, 0.42)' : 'rgba(56, 189, 248, 0.28)';
      ctx.lineWidth = 1.2;
      for (let i = 0; i < 24; i++) {
        const wy = horizonY + 5 + (i * 2.2);
        const wx = ((i * 89 + Math.sin(nowSec * 2 + i) * 20) % width);
        ctx.beginPath();
        ctx.moveTo(wx, wy);
        ctx.lineTo(wx + 32 + (i % 4) * 15, wy);
        ctx.stroke();
      }

      // 2. ELEVATED AEROBAY MAGLEV SKYBRIDGE & MONORAIL POD (CONNECTING VAB TO MCC)
      const bridgeY = groundY - 44;
      ctx.strokeStyle = isDay ? 'rgba(148, 163, 184, 0.78)' : 'rgba(56, 189, 248, 0.4)';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(width * 0.28, bridgeY);
      ctx.lineTo(width * 0.87, bridgeY);
      ctx.stroke();
      // Support Pillars
      for (let px = width * 0.34; px < width * 0.85; px += width * 0.09) {
        ctx.fillStyle = isDay ? '#64748b' : '#1e293b';
        ctx.fillRect(px - 2.5, bridgeY, 5, groundY - bridgeY);
      }
      // Gliding Maglev Pod
      const spanW = width * 0.52;
      const podX = width * 0.31 + ((Math.sin(nowSec * 0.45) + 1) * 0.5) * spanW;
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(podX - 18, bridgeY - 8, 36, 7, 3.5) : ctx.rect(podX - 18, bridgeY - 8, 36, 7);
      ctx.fill();
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(podX - 12, bridgeY - 7, 24, 3);

      // 3. CRYO PROPELLANT TANK FARM & FLARE STACK (FAR LEFT: ~5% WIDTH)
      const tankBaseX = width * 0.05;
      ctx.strokeStyle = isDay ? '#64748b' : '#475569';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(tankBaseX, groundY - 8);
      ctx.lineTo(width * 0.14, groundY - 8);
      ctx.stroke();
      [0, 28].forEach((offset, i) => {
        const tx = tankBaseX + offset;
        const ty = groundY - 22;
        ctx.strokeStyle = isDay ? '#475569' : '#64748b';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(tx - 8, groundY); ctx.lineTo(tx - 5, ty);
        ctx.moveTo(tx + 8, groundY); ctx.lineTo(tx + 5, ty);
        ctx.stroke();
        ctx.fillStyle = isDay ? '#f1f5f9' : '#cbd5e1';
        ctx.beginPath();
        ctx.arc(tx, ty, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#0ea5e9';
        ctx.font = '800 6px "JetBrains Mono", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(i === 0 ? 'LOX' : 'CH4', tx, ty + 2);
      });

      // 4. AEROBAY LAUNCH PAD-01 (LEFT SIDE: ~14% WIDTH)
      const padX = width * 0.14;
      const padBaseY = groundY;

      // Night Xenon Searchlights illuminating Launch Pad-01
      if (!isDay) {
        ctx.save();
        const beam1 = ctx.createLinearGradient(padX - 55, padBaseY, padX + 12, padBaseY - 170);
        beam1.addColorStop(0, 'rgba(186, 230, 253, 0.25)');
        beam1.addColorStop(1, 'rgba(56, 189, 248, 0)');
        ctx.fillStyle = beam1;
        ctx.beginPath();
        ctx.moveTo(padX - 52, padBaseY - 12);
        ctx.lineTo(padX - 5, padBaseY - 185);
        ctx.lineTo(padX + 28, padBaseY - 185);
        ctx.closePath();
        ctx.fill();

        const beam2 = ctx.createLinearGradient(padX + 68, padBaseY, padX + 12, padBaseY - 170);
        beam2.addColorStop(0, 'rgba(186, 230, 253, 0.22)');
        beam2.addColorStop(1, 'rgba(56, 189, 248, 0)');
        ctx.fillStyle = beam2;
        ctx.beginPath();
        ctx.moveTo(padX + 64, padBaseY - 12);
        ctx.lineTo(padX - 2, padBaseY - 185);
        ctx.lineTo(padX + 26, padBaseY - 185);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // Concrete Flame Trench & Pad Slope
      ctx.fillStyle = isDay ? '#475569' : '#1e293b';
      ctx.beginPath();
      ctx.moveTo(padX - 65, padBaseY);
      ctx.lineTo(padX - 45, padBaseY - 16);
      ctx.lineTo(padX + 55, padBaseY - 16);
      ctx.lineTo(padX + 75, padBaseY);
      ctx.closePath();
      ctx.fill();

      // Fixed Service Structure (Lattice Launch Tower)
      const towerX = padX - 34;
      const towerH = 175;
      const towerW = 22;
      ctx.strokeStyle = isDay ? '#334155' : '#64748b';
      ctx.lineWidth = 2;
      ctx.strokeRect(towerX, padBaseY - 16 - towerH, towerW, towerH);

      // Cross-bracing on Launch Tower
      ctx.lineWidth = 1.2;
      for (let y = padBaseY - 16; y > padBaseY - 16 - towerH; y -= 18) {
        ctx.beginPath();
        ctx.moveTo(towerX, y);
        ctx.lineTo(towerX + towerW, y - 18);
        ctx.moveTo(towerX + towerW, y);
        ctx.lineTo(towerX, y - 18);
        ctx.stroke();
      }

      // Lightning Mast atop Tower
      ctx.beginPath();
      ctx.moveTo(towerX + towerW / 2, padBaseY - 16 - towerH);
      ctx.lineTo(towerX + towerW / 2, padBaseY - 16 - towerH - 28);
      ctx.stroke();

      // Blinking Red Aviation Beacon on Tower
      const beaconAlpha = (Math.sin(nowSec * 5) + 1) * 0.5;
      ctx.fillStyle = `rgba(239, 68, 68, ${0.4 + beaconAlpha * 0.6})`;
      ctx.beginPath();
      ctx.arc(towerX + towerW / 2, padBaseY - 16 - towerH - 28, 3.8, 0, Math.PI * 2);
      ctx.fill();

      // Crew Access Swing Arm (retracts during launch!)
      const armRetract = rocketState.phase === 'LAUNCHING' ? Math.min(1, rocketState.altitude / 40) : 0;
      ctx.strokeStyle = isDay ? '#475569' : '#94a3b8';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(towerX + towerW, padBaseY - 135);
      ctx.lineTo(towerX + towerW + 28 * (1 - armRetract * 0.75), padBaseY - 135 - armRetract * 16);
      ctx.stroke();

      // Update Rocket + Booster Landing State Machine + Synchronized Acoustics
      if (rocketState.phase === 'PAD') {
        rocketState.timer++;
        if (rocketState.timer > 4200) {
          window.triggerRocketLaunch();
        }
        if (Math.random() < 0.38) {
          rocketState.plumeParticles.push({
            x: padX + 12 + (Math.random() - 0.5) * 6,
            y: padBaseY - 95 - Math.random() * 40,
            vx: 0.6 + Math.random() * 0.8,
            vy: -0.3 - Math.random() * 0.4,
            r: 4 + Math.random() * 6,
            alpha: 0.45,
            color: '226, 232, 240'
          });
        }
      } else if (rocketState.phase === 'COUNTDOWN') {
        rocketState.timer--;
        if (rocketState.timer === 66 || rocketState.timer === 33) {
          window.playCountdownBeep(false);
        } else if (rocketState.timer === 1) {
          window.playCountdownBeep(true);
          window.playLaunchSound();
        }
        // Water Deluge & Pre-Ignition Steam Plumes
        for (let i = 0; i < 5; i++) {
          rocketState.plumeParticles.push({
            x: padX + 12 + (Math.random() - 0.5) * 22,
            y: padBaseY - 18,
            vx: (Math.random() - 0.5) * 3.8,
            vy: -0.5 - Math.random() * 1.8,
            r: 8 + Math.random() * 13,
            alpha: 0.82,
            color: i % 2 === 0 ? '251, 146, 60' : '241, 245, 249'
          });
        }
        if (rocketState.timer <= 0) {
          rocketState.phase = 'LAUNCHING';
          rocketState.velocity = 0.42;
        }
      } else if (rocketState.phase === 'LAUNCHING') {
        rocketState.velocity = Math.min(9.8, rocketState.velocity + 0.068);
        rocketState.altitude += rocketState.velocity;
        for (let i = 0; i < 6; i++) {
          rocketState.plumeParticles.push({
            x: padX + 12 + (Math.random() - 0.5) * 12,
            y: padBaseY - 18 - rocketState.altitude,
            vx: (Math.random() - 0.5) * 2.6,
            vy: 1.8 + Math.random() * 2.8,
            r: 7 + Math.random() * 15,
            alpha: 0.88,
            color: i === 0 ? '254, 240, 138' : i === 1 ? '249, 115, 22' : '226, 232, 240'
          });
        }
        if (rocketState.altitude > height + 220) {
          rocketState.phase = 'BOOSTER_RETURN';
          rocketState.boosterY = -120;
        }
      } else if (rocketState.phase === 'BOOSTER_RETURN') {
        if (!rocketState.sonicBoomPlayed && rocketState.boosterY > 40) {
          rocketState.sonicBoomPlayed = true;
          window.playBoosterSonicBoom();
        }
        const targetY = padBaseY - 12;
        rocketState.boosterY += (targetY - rocketState.boosterY) * 0.036 + 1.2;
        if (rocketState.boosterY >= targetY - 1) {
          rocketState.phase = 'PAD';
          rocketState.altitude = 0;
          rocketState.velocity = 0;
          rocketState.timer = 0;
        }
      }

      // Draw Orbital Heavy-Lift Rocket on Pad-01
      const rX = padX + 12;
      const rBaseY = padBaseY - 16 - rocketState.altitude;

      if (rocketState.phase === 'COUNTDOWN' || rocketState.phase === 'LAUNCHING') {
        const flameGrad = ctx.createLinearGradient(rX, rBaseY, rX, rBaseY + 64);
        flameGrad.addColorStop(0, '#ffffff');
        flameGrad.addColorStop(0.3, '#fde047');
        flameGrad.addColorStop(0.7, '#f97316');
        flameGrad.addColorStop(1, 'rgba(239, 68, 68, 0)');
        ctx.fillStyle = flameGrad;
        ctx.beginPath();
        ctx.moveTo(rX - 9, rBaseY);
        ctx.lineTo(rX + 9, rBaseY);
        ctx.lineTo(rX + (Math.random() - 0.5) * 6, rBaseY + 46 + Math.random() * 20);
        ctx.closePath();
        ctx.fill();

        // Mach Shock Diamonds inside Exhaust Plume
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        for (let sd = 1; sd <= 3; sd++) {

          ctx.ellipse(rX, rBaseY + sd * 11, 3.2 - sd * 0.6, 5, 0, 0, Math.PI * 2);
          ctx.fill();

      }

      // Side Solid Rocket Boosters
      ctx.fillStyle = isDay ? '#e2e8f0' : '#cbd5e1';
      ctx.fillRect(rX - 15, rBaseY - 88, 6, 84);
      ctx.fillRect(rX + 9, rBaseY - 88, 6, 84);
      ctx.beginPath();
      ctx.moveTo(rX - 15, rBaseY - 88); ctx.lineTo(rX - 12, rBaseY - 98); ctx.lineTo(rX - 9, rBaseY - 88);
      ctx.moveTo(rX + 9, rBaseY - 88); ctx.lineTo(rX + 12, rBaseY - 98); ctx.lineTo(rX + 15, rBaseY - 88);
      ctx.fill();

      // Core Rocket Body
      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(rX - 8, rBaseY - 138, 16, 134);
      // Black Interstage & Aerobay Stripes
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(rX - 8, rBaseY - 92, 16, 12);
      ctx.fillStyle = '#0ea5e9';
      ctx.fillRect(rX - 8, rBaseY - 122, 16, 5);
      // Vertical "AEROBAY" text on rocket core
      ctx.save();
      ctx.fillStyle = '#0284c7';
      ctx.font = '900 6px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('AB-1', rX, rBaseY - 52);
      ctx.restore();
      // Payload Fairing / Nosecone
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.moveTo(rX - 9, rBaseY - 138);
      ctx.quadraticCurveTo(rX, rBaseY - 172, rX + 9, rBaseY - 138);
      ctx.closePath();
      ctx.fill();
      // Engine Nozzles
      ctx.fillStyle = '#334155';
      ctx.fillRect(rX - 6, rBaseY - 4, 4, 4);
      ctx.fillRect(rX + 2, rBaseY - 4, 4, 4);

      // Transonic Max-Q Vapor Cone around Rocket Fairing during Ascent!
      if (rocketState.phase === 'LAUNCHING' && rocketState.altitude > 110 && rocketState.altitude < 360) {
        ctx.save();
        ctx.fillStyle = 'rgba(241, 245, 249, 0.55)';
        ctx.beginPath();
        ctx.moveTo(rX, rBaseY - 142);
        ctx.lineTo(rX - 26, rBaseY - 115);
        ctx.lineTo(rX + 26, rBaseY - 115);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // 5. LANDING ZONE LZ-01 (REUSABLE BOOSTER PAD AT ~22% WIDTH)
      const lzX = width * 0.225;
      ctx.fillStyle = isDay ? '#334155' : '#1e293b';
      ctx.fillRect(lzX - 24, groundY - 6, 48, 6);
      // Illuminated LZ-01 Pad Beacon Lights
      ctx.fillStyle = '#10b981';
      ctx.fillRect(lzX - 20, groundY - 7, 5, 2);
      ctx.fillRect(lzX + 15, groundY - 7, 5, 2);

      const bY = rocketState.phase === 'BOOSTER_RETURN' ? rocketState.boosterY : groundY - 6;
      // Reusable First-Stage Booster with Grid Fins & Landing Legs
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(lzX - 5, bY - 64, 10, 56);
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(lzX - 5, bY - 64, 10, 7);
      // Grid fins
      ctx.fillRect(lzX - 9, bY - 58, 4, 3);
      ctx.fillRect(lzX + 5, bY - 58, 4, 3);
      // Deployed Carbon Landing Legs
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(lzX - 5, bY - 14); ctx.lineTo(lzX - 13, bY);
      ctx.moveTo(lzX + 5, bY - 14); ctx.lineTo(lzX + 13, bY);
      ctx.stroke();
      if (rocketState.phase === 'BOOSTER_RETURN') {
        ctx.fillStyle = '#f97316';
        ctx.beginPath();
        ctx.moveTo(lzX - 4, bY - 8);
        ctx.lineTo(lzX + 4, bY - 8);
        ctx.lineTo(lzX, bY + 20 + Math.random() * 10);
        ctx.closePath();
        ctx.fill();
      }

      // Update & Draw Plume / Cryo Particles
      for (let i = rocketState.plumeParticles.length - 1; i >= 0; i--) {
        const p = rocketState.plumeParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.r += 0.25;
        p.alpha -= 0.012;
        if (p.alpha <= 0) {
          rocketState.plumeParticles.splice(i, 1);
          continue;
        }
        ctx.fillStyle = `rgba(${p.color}, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // 6. AEROBAY VEHICLE ASSEMBLY BUILDING (VAB - LEFT-CENTER: ~28% WIDTH)
      const vabX = width * 0.28;
      const vabW = Math.max(120, Math.min(170, width * 0.135));
      const vabH = 152;
      const vabY = groundY - vabH;

      // Main VAB Structure
      ctx.fillStyle = isDay ? '#cbd5e1' : '#1e293b';
      ctx.fillRect(vabX, vabY, vabW, vabH);
      ctx.strokeStyle = isDay ? '#64748b' : '#38bdf8';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(vabX, vabY, vabW, vabH);

      // Rooftop Neon Sign on VAB: "AEROBAY VAB"
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(vabX + vabW / 2 - 40, vabY - 14, 80, 14);
      ctx.strokeStyle = '#38bdf8';
      ctx.strokeRect(vabX + vabW / 2 - 40, vabY - 14, 80, 14);
      ctx.fillStyle = '#38bdf8';
      ctx.font = '900 8px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('AEROBAY VAB', vabX + vabW / 2, vabY - 4);

      // High-Bay Vertical Doors
      ctx.fillStyle = isDay ? '#334155' : '#0f172a';
      ctx.fillRect(vabX + 12, vabY + 26, 28, vabH - 26);
      ctx.fillRect(vabX + vabW - 40, vabY + 26, 28, vabH - 26);

      // Inside Right Bay Door: Overhead Gantry Crane & Welding Sparks
      const craneY = vabY + 46 + Math.sin(nowSec * 1.2) * 14;
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(vabX + vabW - 38, craneY);
      ctx.lineTo(vabX + vabW - 14, craneY);
      ctx.stroke();

      // Horizontal Bay Door Ribs on Left Door
      ctx.strokeStyle = isDay ? '#94a3b8' : '#334155';
      ctx.lineWidth = 1;
      for (let ry = vabY + 38; ry < groundY; ry += 14) {
        ctx.beginPath();
        ctx.moveTo(vabX + 12, ry); ctx.lineTo(vabX + 40, ry);
        ctx.stroke();
      }

      // Central AEROBAY Emblem & Illuminated Bay Windows
      ctx.fillStyle = '#0ea5e9';
      ctx.beginPath();
      ctx.arc(vabX + vabW / 2, vabY + 45, 17, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 7.5px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('AEROBAY', vabX + vabW / 2, vabY + 48);

      // Glowing Interior Work Bays
      const winColor = isDay ? 'rgba(56, 189, 248, 0.35)' : 'rgba(253, 224, 71, 0.78)';
      for (let wy = vabY + 72; wy < groundY - 16; wy += 16) {
        ctx.fillStyle = winColor;
        ctx.fillRect(vabX + vabW / 2 - 14, wy, 28, 9);
      }

      // 7. AEROBAY MISSION CONTROL CENTER (MCC - RIGHT-CENTER: ~62% WIDTH)
      const mccX = width * 0.62;
      const mccW = Math.max(140, Math.min(200, width * 0.165));
      const mccH = 116;
      const mccY = groundY - mccH;

      // Main Glass & Steel Mission Control Building
      ctx.fillStyle = isDay ? '#94a3b8' : '#0f172a';
      ctx.fillRect(mccX, mccY, mccW, mccH);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(mccX, mccY, mccW, mccH);

      // Rooftop Neon Sign: "AEROBAY HQ"
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(mccX + mccW / 2 - 38, mccY - 14, 76, 14);
      ctx.strokeStyle = '#a855f7';
      ctx.strokeRect(mccX + mccW / 2 - 38, mccY - 14, 76, 14);
      ctx.fillStyle = '#e9d5ff';
      ctx.font = '900 8px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.fillText('AEROBAY HQ', mccX + mccW / 2, mccY - 4);

      // Illuminated Ribbon Windows (4 Floors of Telemetry Screens & Silhouette Desks)
      for (let floor = 0; floor < 4; floor++) {
        const fy = mccY + 16 + floor * 22;
        ctx.fillStyle = isDay ? 'rgba(14, 165, 233, 0.45)' : 'rgba(56, 189, 248, 0.68)';
        ctx.fillRect(mccX + 10, fy, mccW - 20, 14);
        ctx.fillStyle = isNight ? '#fde047' : '#e0f2fe';
        for (let sx = mccX + 16; sx < mccX + mccW - 24; sx += 22) {
          ctx.fillRect(sx, fy + 3, 12, 7);
          ctx.fillStyle = '#0f172a';
          ctx.beginPath();
          ctx.arc(sx + 6, fy + 8, 2.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = isNight ? '#fde047' : '#e0f2fe';
        }
      }

      // Glowing Ground Entrance Revolving Doors on Aerobay HQ
      ctx.fillStyle = 'rgba(56, 189, 248, 0.85)';
      ctx.fillRect(mccX + mccW / 2 - 14, groundY - 14, 28, 14);

      // Rooftop Rotating Deep-Space Radar Dish on MCC
      const dishX = mccX + mccW * 0.22;
      const dishY = mccY;
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(dishX, dishY);
      ctx.lineTo(dishX - 8, dishY - 18);
      ctx.lineTo(dishX + 8, dishY - 18);
      ctx.closePath();
      ctx.stroke();

      const dishAngle = Math.sin(nowSec * 0.7) * 0.45 - 0.5;
      ctx.save();
      ctx.translate(dishX, dishY - 20);
      ctx.rotate(dishAngle);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(0, 0, 16, Math.PI * 0.15, Math.PI * 0.85);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, 16);
      ctx.lineTo(0, 4);
      ctx.stroke();
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(0, 3, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Rooftop Communications Tower on MCC
      const antX = mccX + mccW * 0.82;
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(antX, mccY);
      ctx.lineTo(antX, mccY - 34);
      ctx.stroke();
      const pulseR = (nowSec * 22) % 36;
      ctx.strokeStyle = `rgba(56, 189, 248, ${1 - pulseR / 36})`;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(antX, mccY - 34, pulseR, 0, Math.PI * 2);
      ctx.stroke();

      // 8. GEODESIC DRONE LAB, BIODOME & SOLAR ARRAY FARM (FAR RIGHT: ~86% WIDTH)
      const domeX = width * 0.86;
      const domeR = 48;
      ctx.fillStyle = isDay ? 'rgba(224, 242, 254, 0.55)' : 'rgba(30, 58, 138, 0.55)';
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(domeX, groundY, domeR, Math.PI, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(domeX, groundY, domeR * 0.68, Math.PI, 0);
      ctx.moveTo(domeX - domeR, groundY); ctx.lineTo(domeX + domeR, groundY);
      ctx.moveTo(domeX, groundY); ctx.lineTo(domeX, groundY - domeR);
      ctx.moveTo(domeX, groundY); ctx.lineTo(domeX - domeR * 0.7, groundY - domeR * 0.7);
      ctx.moveTo(domeX, groundY); ctx.lineTo(domeX + domeR * 0.7, groundY - domeR * 0.7);
      ctx.stroke();

      // Sun-Tracking Solar Panels next to Biodome
      const panelTilt = isDay ? Math.max(-0.45, Math.min(0.45, Math.cos(sunAngle) * 0.4)) : 0;
      [width * 0.935, width * 0.965].forEach(sx => {
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sx, groundY);
        ctx.lineTo(sx, groundY - 16);
        ctx.stroke();
        ctx.save();
        ctx.translate(sx, groundY - 16);
        ctx.rotate(panelTilt);
        ctx.fillStyle = '#0284c7';
        ctx.strokeStyle = '#bae6fd';
        ctx.lineWidth = 1;
        ctx.fillRect(-11, -3, 22, 5);
        ctx.strokeRect(-11, -3, 22, 5);
        ctx.restore();
      });

      // 9. SPACEPORT TARMAC, ELECTRIC ROVER & PLAZA WALKWAY
      ctx.fillStyle = isDay ? '#1e293b' : '#090d16';
      ctx.fillRect(0, groundY, width, height - groundY);

      // Glowing Cyan Plaza Walkway Strip
      ctx.fillStyle = isDay ? '#334155' : '#0f172a';
      ctx.fillRect(0, groundY + 4, width, 24);
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.55)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, groundY + 4);
      ctx.lineTo(width, groundY + 4);
      ctx.stroke();

      // Runway / Walkway Guide Lights
      for (let lx = 20; lx < width; lx += 50) {
        const blink = ((Math.floor(nowSec * 3 + lx) % 4) === 0) ? 1 : 0.45;
        ctx.fillStyle = `rgba(56, 189, 248, ${blink})`;
        ctx.beginPath();
        ctx.arc(lx, groundY + 7, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }

      // Autonomous Aerobay Ground Rover / Crew Transport Shuttle on Tarmac
      const roverX = ((nowSec * 34) % (width + 120)) - 60;
      const roverY = groundY + 2;
      ctx.save();
      ctx.translate(roverX, roverY);
      if (!isDay) {
        const hGrad = ctx.createLinearGradient(12, -5, 65, 2);
        hGrad.addColorStop(0, 'rgba(254, 240, 138, 0.45)');
        hGrad.addColorStop(1, 'rgba(254, 240, 138, 0)');
        ctx.fillStyle = hGrad;
        ctx.beginPath();
        ctx.moveTo(12, -6); ctx.lineTo(65, -14); ctx.lineTo(65, 4); ctx.closePath();
        ctx.fill();
      }
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(-12, -10, 24, 8, 3) : ctx.rect(-12, -10, 24, 8);
      ctx.fill();
      ctx.fillStyle = '#0ea5e9';
      ctx.fillRect(-8, -9, 16, 4);
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(-7, -1, 3, 0, Math.PI * 2);
      ctx.arc(7, -1, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawDrones(isDay) {
      const nowSec = Date.now() * 0.001;
      const padX = width * 0.14 + 12;
      const groundY = height - 68;

      drones.forEach((d, idx) => {
        if (d.type === 'inspector' && rocketState.phase === 'PAD') {
          d.targetX = padX + 42 + Math.sin(nowSec * 1.2 + idx) * 18;

      },
      {
        name: 'OpenRouter', enabled: () => !!AI_CONFIG.openrouterKey,
        run: text => chatCompletion('https://openrouter.ai/api/v1/chat/completions',
          { model: 'meta-llama/llama-3.3-70b-instruct:free', temperature: 0.2,
            messages: [{ role: 'system', content: AI_SYSTEM }, { role: 'user', content: text }] },
          { Authorization: `Bearer ${AI_CONFIG.openrouterKey}`, 'HTTP-Referer': location.origin, 'X-Title': 'Aerobay Work Portal' })
      },
    ];

    // Tries each enabled provider in order; returns { text, provider }
    async function summarizeWithAI(text) {
      const errors = [];
      for (const p of AI_PROVIDERS) {
        if (!p.enabled()) continue;
        try {
          const out = await Promise.race([p.run(text), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 25000))]);
          const cleaned = out.split('\n').map(l => l.trim()).filter(Boolean)
            .map(l => l.replace(/^[-*•·]\s*/, '• ')).map(l => l.startsWith('• ') ? l : '• ' + l).join('\n');
          return { text: cleaned, provider: p.name };
        } catch (e) { errors.push(`${p.name}: ${e.message}`); console.warn('AI provider failed', p.name, e); }
      }
      throw new Error(errors.join(' | ') || 'No AI provider enabled');
    }

    function App() {

      const [authMode, setAuthMode] = useState('login');

      const [newPw, setNewPw] = useState('');

      /* ---------- post ---------- */

      const [aiApplied, setAiApplied] = useState(false);
      const [aiProvider, setAiProvider] = useState('');

      /* ---------- feed / reports ---------- */
      const [deptFilter, setDeptFilter] = useState('ALL');

      /* ---------- users / admin ---------- */
      const [search, setSearch] = useState(''); const [pendingOnly, setPendingOnly] = useState(false);

      const [newDeptName, setNewDeptName] = useState('');

      const addToast = (msg, type = 'success') => {

        supabase.from('profiles').select('id, name, email, role, level').then(({ data }) => {
          if (data && data.length > 0 && window.syncHubRoster) {
            window.syncHubRoster(data);

      /* =====================================================

      const visibleProfiles = useMemo(() => profiles.filter(p => canView(profile, p)), [profiles, profile]);

      const canSeeUsersPage = !!profile && (isExec(profile) || (profile.role === 'user' && profile.level >= 2));
      const pendingCount = profiles.filter(isPending).length;

      const userRows = profiles.filter(p => (!pendingOnly || isPending(p)) &&
        (!q || [p.name, p.email, p.username, deptName(p.department_id), roleLabel(p)].some(v => (v || '').toLowerCase().includes(q))));

      const calculateStreak = () => {
        if (!profile) return 0;

        let streak = 0; const d = new Date();

        for (let i = 0; i < 90; i++) {
          if (isWeekend(d)) { d.setDate(d.getDate() - 1); continue; }

      /* =====================================================
         AUTH HANDLERS
         ===================================================== */
      const redirectTo = window.location.origin + window.location.pathname;
      const handleLogin = async () => {
        const { error } = await supabase.auth.signInWithPassword({ email: email.trim(), password: pw });

      /* =====================================================

      const toggleMic = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (isListening) return;
        const recognition = new SpeechRecognition();
        recognition.continuous = false; recognition.interimResults = false;
        recognition.onstart = () => setIsListening(true);
        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          const cleanText = transcript.charAt(0).toUpperCase() + transcript.slice(1) + (/[.!?]$/.test(transcript) ? '' : '.');
          setPostText(prev => prev ? prev + '\n' + cleanText : cleanText);
          setAiApplied(false); addToast('Audio transcribed!');
        };
        recognition.onerror = () => { setIsListening(false); addToast('Recognition failed.', 'error'); };
        recognition.onend = () => setIsListening(false);

      const previewAI = async () => { if (!postText.trim()) return; setPostText(await runAI(postText.trim())); };

      const handlePost = async () => {

      const openEdit = p => {
        setEditUser(p);
        setEditForm({
          name: p.name || '', username: p.username || '', department_id: p.department_id || '', disabled: !!p.disabled,
          roleKey: isAdmin(profile) ? (p.role === 'admin' ? 'admin' : p.role === 'executive' ? 'executive' : String(p.level))
                                    : String(Math.max(1, Math.min(p.level || 1, profile.level - 1)))
        });

      const saveUser = async () => {
        const f = editForm; let patch;
        if (isAdmin(profile)) {
          const isRole = f.roleKey === 'admin' || f.roleKey === 'executive';
          patch = { name: f.name.trim(), username: f.username.trim() || null, department_id: f.department_id || null, disabled: f.disabled,
